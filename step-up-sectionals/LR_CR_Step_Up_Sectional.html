<title>LR-CR Step-Up Sectional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: exam booklet. Sticky invigilator bar with the clock; the passage (reading face) beside its question column; results as a marked script. Aubergine marks the LR-CR series. */
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#1a2230; --muted:#5a6676; --rule:#d5dbe3;
  --accent:#5a3570; --accent-soft:#efe6f3; --accent-ink:#ffffff;
  --right:#2a7a4d; --right-soft:#e1f1e7; --wrong:#b23f37; --wrong-soft:#f7e3e0; --skip:#9a6b0c; --skip-soft:#f6ecd5;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141b; --paper:#171c25; --ink:#e4e9f0; --muted:#97a3b3; --rule:#2a3240;
  --accent:#c9a6dd; --accent-soft:#2b2033; --accent-ink:#0d121a;
  --right:#63c48c; --right-soft:#152d20; --wrong:#ee8a80; --wrong-soft:#3a1e1b; --skip:#e2b250; --skip-soft:#33290f;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#171c25; --ink:#e4e9f0; --muted:#97a3b3; --rule:#2a3240;
  --accent:#c9a6dd; --accent-soft:#2b2033; --accent-ink:#0d121a;
  --right:#63c48c; --right-soft:#152d20; --wrong:#ee8a80; --wrong-soft:#3a1e1b; --skip:#e2b250; --skip-soft:#33290f;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 clamp(28px,4.4vw,40px)/1.15 var(--f-read)}
h2{font:600 22px/1.25 var(--f-read)}
h3{font:600 15px/1.35 var(--f-ui)}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--wrong);color:var(--paper);border-color:var(--wrong)}
.stack{display:flex;flex-direction:column;gap:20px}
/* start */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:18px}
.intro > *{min-width:0}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.fact b{display:block;font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.plist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.plist b{font:500 12px/1.9 var(--f-mono);color:var(--muted)}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.past{display:flex;flex-direction:column;gap:6px;font-size:14px}
.past div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:6px;font-variant-numeric:tabular-nums}
/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.clock{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:76px}
.clock.low{color:var(--wrong)}
.count{font:500 13px var(--f-mono);color:var(--muted)}
.spacer{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 11px;font:500 12px/1.5 var(--f-mono);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{opacity:.75}
.tab .fl{color:var(--skip)}
.tab[aria-current="true"] .fl{color:inherit}
.saved{font:12px var(--f-mono);color:var(--muted)}
/* test */
.test{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;padding-top:18px}
.test > *{min-width:0}
.passage{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 24px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 96px);overflow:auto}
.passage .head{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.passage .body{font:16.5px/1.72 var(--f-read);display:flex;flex-direction:column;gap:12px;max-width:68ch}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qn{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.stem{font-weight:500}
.quote{font:15.5px/1.6 var(--f-read);background:var(--bg);border-radius:8px;padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.stmts{display:flex;flex-direction:column;gap:6px;font:15px/1.6 var(--f-read);background:var(--bg);border-radius:8px;padding:10px 12px}
.stmts div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.stmts b{font:500 12.5px/1.95 var(--f-mono);color:var(--muted)}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--paper);position:relative}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .L{font:500 13px/1.6 var(--f-mono);width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.flag{border:0;background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer;padding:2px 4px}
.flag[aria-pressed="true"]{color:var(--skip)}
.clear{border:0;background:none;color:var(--muted);font:12px var(--f-ui);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.confirm{background:var(--skip-soft);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
/* results */
.scorehead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.traps{display:flex;flex-direction:column;gap:8px}
.trap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.code{font:600 13px var(--f-mono);width:30px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--wrong-soft);color:var(--wrong)}
.tbar{height:8px;border-radius:4px;background:var(--wrong);opacity:.85}
.review{display:flex;flex-direction:column;gap:12px}
.rq{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rq.r{border-left-color:var(--right)} .rq.w{border-left-color:var(--wrong)} .rq.u{border-left-color:var(--skip)}
.rtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ro{font-size:14px;padding:6px 8px;border-radius:6px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:start}
.ro.ans{background:var(--right-soft)} .ro.bad{background:var(--wrong-soft)}
.ro b{font-family:var(--f-mono)}
.pill{font:500 11px/1.5 var(--f-mono);padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;align-self:start}
.pill.w{background:var(--wrong-soft);color:var(--wrong)} .pill.r{background:var(--right-soft);color:var(--right)} .pill.u{background:var(--skip-soft);color:var(--skip)}
.why{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details.pz summary,details.ex summary{cursor:pointer;color:var(--muted);font-size:13px}
.ptable{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left}
th{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.banner{background:var(--skip-soft);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14px}
@media (max-width:860px){
  .intro,.test{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .scorehead{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){ .opt{transition:background .12s,border-color .12s} }
</style>

<script>
/* ------------------------------------------------------------------ CONTENT */
const DATA={"codes": {"A": ["Added idea", "Brings in a cause, motive, fact or remedy the passage never gives, often one that is plausible in the real world."], "C": ["Correlation read as cause", "Treats an association, or a change caused by something else, as proof of the cause in question."], "E": ["NOT / EXCEPT reversal", "This option is supported (or does what the stem says the others do). Picking it means reading NOT or EXCEPT as if it were not there."], "K": ["Not forced", "On a must-be-true or necessary-condition question: one route that is possible, offered as if it were the only one."], "L": ["Mix-up or reversal", "Swaps two things the passage keeps apart, contradicts a stated line, or helps the argument when the stem asks you to hurt it."], "M": ["Clock or arithmetic slip", "Uses a raw camera time, adds an offset instead of subtracting it, or uses the wrong figure in a calculation."], "N": ["Supported, not needed", "Plausible or even helpful, but the argument survives without it (assumption), or it backs a premise rather than the link asked about."], "O": ["Half-right option", "One half fits (often a word that echoes the passage); the other half, or the 'because' clause, is false."], "P": ["Part, not the whole", "True of one paragraph, one example or one cause, but not of the whole passage or the whole effect asked about."], "R": ["Rival view or echo", "The view the author reports or rejects, or the passage's own words with the meaning shifted."], "T": ["Wrong target", "Bears on a side claim, a different mechanism or the outcome rather than the point the question names."], "W": ["Wrong weighting", "Gives a later consequence or a side point the role of the cause or thesis."], "X": ["Unearned absolute", "Needs 'only / every / never / always / no bearing at all', or turns the passage's 'may' into a fact. The passage never earns it."]}, "passages": [{"id": "p1", "label": "Passage I", "kind": "Education policy: compulsory attendance", "text": ["Few rules in Indian higher education are defended as confidently as the one that bars a student from the examination unless she has attended three-quarters of her classes. The defence usually rests on a figure. In college after college, students who attend most of their classes score better than those who attend few; in one large college, those above the 75 per cent line averaged nearly fifteen marks more than those below it. If attendance raises marks, the reasoning goes, a rule that raises attendance must raise marks too.", "The figure shows less than it seems to. Students who attend regularly differ from those who do not in ways that would raise their marks whether or not they attended: they tend to be more motivated, less likely to be working for a wage and more likely to live near the campus. A rule cannot hand out these advantages; it can only move bodies into rooms. The question that matters is what happens to the marks of the students the rule actually moves, those who would otherwise have stayed away, and a comparison of habitual attenders with habitual absentees cannot answer it.", "There is evidence that can. When one university abolished its attendance requirement for second-year students while keeping it for the first year, attendance among second-years fell by about a fifth, yet their results were no different from those of the second-year classes of the three preceding years. The students who stopped coming, it appears, were largely those for whom the lectures added little, either because they learned as much from the readings or because the lectures did little more than repeat them.", "None of this means that attendance is worthless. Where teaching is good, students come without being compelled, and a class that must conscript its audience has told us something about itself. The rule's real effect may be to shield poor teaching from the verdict that empty benches would deliver. It also falls hardest on those least able to bear it: the student who misses classes because she works evenings to pay her fees is barred from the examination, while the student who attends and sleeps through every lecture is not.", "A university that wants better results should measure results, not presence. It should drop the requirement, and ask instead why its students stay away."], "qs": [{"stem": "Which of the following is the author most likely to agree with?", "o": ["Compulsory attendance probably raises the marks of the weakest students, even if it does little for the strongest", "Where lectures are good, a rule requiring attendance does no harm, since students would attend in any case", "The marks gap between attenders and absentees overstates what compelling attendance could achieve", "A university should keep the rule wherever its lectures add something that the readings do not supply"]}, {"stem": "The author's use of the second-year results as evidence depends on which of the following assumptions?", "o": ["The second-years after the change were not, as a group, abler or better taught than the three classes before them", "Every student who stopped attending learned as much from the readings as he or she would have learned in the lectures", "Attendance among first-year students, for whom the rule was kept, did not fall in the year that the change was made", "Second-year lectures at that university were, taken as a whole, of poorer quality than the lectures given to its first-years"]}, {"stem": "Which of the following, if true, would most weaken the author's argument?", "o": ["Students who work in the evenings to pay their fees make up only a small share of all those barred from examinations", "In several other colleges as well, students above the 75 per cent line scored higher than the students below it", "Attendance among the second-years, after falling by a fifth, returned within three years to the level it had reached under the rule", "Second-years who stopped attending later failed the final-year papers built on their second-year courses twice as often as comparable students from compulsory years"]}, {"stem": "If the information in the passage is correct, which of the following must necessarily be true of the large college mentioned in the first paragraph?", "o": ["At least one student there above the 75 per cent line scored below the average of those below it", "At least one student there below the 75 per cent line scored below the average of those above it", "Most of the students there above the 75 per cent line scored higher than the average of those below it", "Students there below the 75 per cent line would have scored about fifteen marks more had they attended more classes"]}, {"stem": "Which of the following is most similar to the reasoning in the second paragraph of the passage?", "o": ["Children from homes full of books read well, but such homes also tend to have educated, attentive parents, so handing out books may not by itself improve reading", "Firms that hold regular meetings are more productive, but productive firms can better afford meetings, so the meetings may be a result of productivity rather than its cause", "Villages with more wells have healthier children, and when wells were dug in villages chosen by lottery, the children's health improved, so wells do improve health", "Towns with more parks have fitter residents, but such towns also tend to be richer, so building parks makes no difference to how fit their residents are"]}]}, {"id": "p2", "label": "Passage II", "kind": "Agriculture and environment: water against air", "text": ["In 2009 Punjab made it punishable to transplant paddy before a date in June notified by the state. The aim was to save groundwater. Farmers who planted in May, at the height of summer, had to keep their fields flooded while evaporation was fiercest, and the state's water table had been falling for decades as tube wells, many of them run on free electricity, drew more from the aquifers than the rains put back. Moving transplantation closer to the arrival of the monsoon would let the rain do some of the work that the pumps had been doing.", "By its own measure the law worked: studies of the following years found that the water table fell more slowly where it was enforced. But the law moved the end of the season as well as its start. Paddy transplanted later is harvested later, and in Punjab the paddy harvest is followed within weeks by the sowing of wheat. A later harvest left farmers less time to clear their fields, and the cheapest way to clear a field of paddy straw in a hurry is to set fire to it. Satellite records show the burning shifting later into the autumn, and studies have linked the shift to the smoke that settles over Delhi each November.", "It would be easy to conclude that the law simply traded one harm for another. That conclusion is too quick. The smoke is not the inevitable price of saving water; it is the price of saving water while leaving everything else as it was: the short gap before wheat, the support prices that make paddy the safest crop, the free power that makes pumping costless at the margin. A farmer who could sow wheat directly into the stubble, with a machine that cuts and spreads the straw as it goes, would have no reason to burn, whatever date he planted his paddy. Such machines exist; they are costly, and many smallholders cannot get one on the days when their fields are ready.", "The lesson is not that the law was a mistake but that a rule aimed at one margin of a farmer's decision will be absorbed at another. Policies that treat the water and the air as separate problems will keep discovering that the farmer does not."], "qs": [{"stem": "The author's claim that the smoke 'is not the inevitable price of saving water' depends on which of the following assumptions?", "o": ["Machines that sow wheat into standing stubble may soon become cheap enough for most smallholders to buy within a few years", "Delaying the transplanting of paddy saves more groundwater than any other policy that the state could possibly adopt instead", "Most of the smoke that settles over Delhi each November comes from the fires that are lit in Punjab's paddy fields", "Burning the straw gives farmers no benefit, such as killing pests, that sowing into the stubble would fail to give them"]}, {"stem": "Suppose that satellites counted no more fires in Punjab's fields after 2009 than before, and yet studies attributed a larger share of Delhi's November smoke to those fires. Which of the following, if true, would best resolve this apparent conundrum?", "o": ["Vehicle traffic in Delhi grew rapidly over the same years, adding more and more to the city's own emissions in every November", "Smoke released in late autumn, when winds are slack and cold air holds it low, disperses far less than earlier smoke", "Farmers who transplanted their paddy later in the season also used less water per hectare in the weeks that followed it", "Many farmers began to burn only part of their straw, ploughing the rest back into the soil before sowing their wheat"]}, {"stem": "Which of the following, if true, would most strengthen the author's claim that 'a rule aimed at one margin of a farmer's decision will be absorbed at another'?", "o": ["The law also cut the power drawn by farm pumps in May, easing the strain on the state's grid in the hottest weeks of the year", "When the state later cut farms' hours of free power, the groundwater they drew fell by about as much as the hours were cut", "A ban on burning straw was followed by fewer fires in satellite counts, but many farmers had only moved their burning to hours between the satellites' passes", "Farmers who own machines that sow into standing stubble burn far less of their straw than farmers who have no such machines"]}, {"stem": "Based only on the author's statement that 'Policies that treat the water and the air as separate problems will keep discovering that the farmer does not', which of the following would the author be most likely to agree with?", "o": ["A rule on a farmer's water will change what he does with his straw, since he weighs the two together", "A policy on groundwater can succeed only if those who frame it also frame the policy on clean air", "Farmers, unlike the officials who make policy, understand that water and air are in truth a single problem", "Rules aimed at farmers' use of water have so far done more harm to the air than good to the water"]}, {"stem": "Based on the author's arguments, which of the following would be the most effective way of reducing the smoke without giving up the savings in groundwater?", "o": ["A one-time subsidy that halves the price of a machine that sows into stubble, for any farmer who buys one", "Withdrawing free electricity from farms, so that each extra hour of pumping costs the farmer something", "Heavy fines on any farmer whose field is seen burning, enforced through the satellite records of fires", "A pool of stubble-sowing machines for hire, scheduled around each area's harvest so that smallholders can use one in time"]}]}, {"id": "p3", "label": "Passage III", "kind": "Deduction: the leaked question paper", "text": ["On the morning of 15 March, shortly before a university's final-year Contract Law examination, photographs of the question paper were found circulating among students. The paper had been sealed in a packet on the evening of 14 March and locked in the examination cell's strongroom. The following facts have been established beyond doubt.", "Fact 1. At 8:00 p.m. on 14 March the sealed packet was chained to a shelf inside the strongroom, which was then empty and was locked. The packet did not leave the strongroom before 7:00 a.m. on 15 March, when its seal was found to have been lifted and carefully replaced.", "Fact 2. The strongroom door opens from outside only when a staff card is swiped and the correct six-digit PIN is keyed in. Staff cards cannot be copied. The door's log, whose clock is accurate, records each opening from outside and the card used. From inside, the door opens with a push bar, and such openings are not recorded. The door closes and locks itself as soon as it is released.", "Fact 3. Between 8:00 p.m. and 7:00 a.m. the log records a single opening from outside, at 1:14 a.m., with the card issued to Ms. Rao, the Controller of Examinations.", "Fact 4. Throughout that night, the PIN was known only to Ms. Rao and to Mr. Kohli, her deputy.", "Fact 5. From 9:00 p.m. on 14 March until the afternoon of 15 March, Ms. Rao was at a wedding in another city.", "Fact 6. At 6:00 p.m., in Mr. Kohli's presence, Ms. Rao locked her card in her desk drawer, which can be locked and unlocked only with a key, and left the building without opening it again. She kept her own key to the drawer with her and did not return that night. The only other key to the drawer is a master key kept on a hook in the night attendant's room. At 7:00 a.m. the drawer was found locked and unforced, with the card inside.", "Fact 7. The building has a single entrance, filmed by a camera whose clock runs exactly fifteen minutes fast. Apart from Ravi, the night attendant, who was inside the building from 8:00 p.m. to 7:00 a.m., the only people in the building at any time between those hours were Mr. Kohli, whom the camera shows entering at 12:50 a.m. and leaving at 1:40 a.m., and Mr. Jain, the university's IT officer, whom it shows entering at 1:25 a.m. and leaving at 2:40 a.m. Between those hours, each of the two entered and left only once.", "Fact 8. The photographs were taken with a phone held over the paper as it lay open on the strongroom shelf, at 1:52 a.m. by the phone's clock, which was accurate."], "qs": [{"stem": "If the established facts are correct, which of the following must necessarily be true?", "o": ["Mr. Kohli keyed in the PIN at 1:14 a.m., and Ms. Rao's card had been taken from her drawer at some time after 8:00 p.m.", "Mr. Kohli keyed in the PIN at 1:14 a.m., and Ms. Rao's drawer had been opened with the master key before then", "Mr. Kohli keyed in the PIN at 1:14 a.m., and the card was back in Ms. Rao's drawer before he left the building", "Mr. Kohli keyed in the PIN at 1:14 a.m., and it was he who swiped Ms. Rao's card at the strongroom door"]}, {"stem": "What is the earliest time after 8:00 p.m. at which Mr. Jain could have been inside the strongroom?", "o": ["1:10 a.m.", "1:25 a.m.", "1:14 a.m.", "1:40 a.m."]}, {"stem": "If it was Mr. Jain who keyed in the PIN at 1:14 a.m., which of the established facts must be incorrect?", "o": ["Fact 4, that only Ms. Rao and Mr. Kohli knew the PIN that night", "Fact 7, that the camera shows Mr. Jain entering the building at 1:25 a.m.", "Fact 6, that the only keys to Ms. Rao's drawer were hers and the master key", "Fact 3, that the strongroom was opened from outside only once that night"]}, {"stem": "A detective argues: 'Ravi appears in none of the camera's recordings that night. So he was never near the strongroom and can have had no part in the leak.' Which of the following best describes the flaw in this argument?", "o": ["It ignores that the camera's fast clock may have filed Ravi's recordings under the wrong hour of the night", "It overlooks that the strongroom's log, not the camera, is the record that shows who went into the strongroom", "It ignores that the master key to Ms. Rao's drawer was kept in Ravi's room, a fact that by itself puts him at the scene", "It reads silence in a record of the entrance as proof of where Ravi was, though he was inside all night"]}, {"stem": "Considering all the established facts, which of the following is the most reasonable inference?", "o": ["Mr. Kohli and Mr. Jain carried out the leak together, Mr. Kohli opening the door and Mr. Jain taking the photographs", "Ravi must have taken part in the leak, since the master key that could release Ms. Rao's card was kept in his room", "At least two people took part, since whoever keyed in the PIN had left the building before the photographs were taken", "Mr. Kohli most probably took the photographs himself, since he alone could have opened the strongroom door that night"]}, {"stem": "Which of the following is necessary for the leak to have been carried out without anyone being let into the strongroom from inside?", "o": ["Mr. Jain was at the strongroom door with Mr. Kohli when it was opened from outside at 1:14 a.m.", "Whoever took the photographs went in through the opening logged at 1:14 a.m., before the door next closed", "Mr. Kohli remained inside the strongroom until the photographs had been taken", "Ravi opened Ms. Rao's drawer with the master key before the strongroom was opened"]}]}, {"id": "p4", "label": "Passage IV", "kind": "Social science: what the screen proved", "text": ["Few findings about discrimination have travelled as far as the one about the screen. In the 1970s and 1980s many American orchestras began to audition players behind a screen, so that the committee could hear a candidate without seeing who was playing. A study published in 2000 by two economists, using audition records from several leading orchestras, concluded that the screen had substantially raised the chances that a woman would advance and be hired, and that it could account for a sizeable part of the growth in the share of women in those orchestras. The finding has since been cited in countless books, speeches and training sessions as proof that blind evaluation removes bias, and as a model for hiring in every field.", "The study deserved its attention; the use made of it deserves less. Orchestras did not adopt screens all at once or in a way the researchers controlled, and the women who auditioned behind screens were not necessarily the same kind of candidates as those who auditioned in the open. The authors were alert to this and compared the same individuals' results in screened and unscreened rounds, but that left them with small numbers, and many of their estimates were statistically imprecise; some, taken on their own, pointed the other way. The authors hedged their conclusions accordingly. The hedges did not travel with the headline.", "Nor would a precise result settle what the screen is usually cited for. A screen removes one kind of information, what the candidate looks like, while leaving the music, which is the thing being judged, untouched. Most hiring is not like this. An interview for a manager's post, or the review of a scientist's work, cannot screen off the candidate without screening off much of what is being judged. What an orchestra can do with a curtain, a firm can attempt only with rules that strip information from applications, and such rules may remove signals that matter along with those that do not.", "None of this is a reason to take the screens down. The case for them never rested on a single study: a committee that cannot see a candidate cannot be swayed by her appearance, whatever the statistics show. The error lies elsewhere: in treating a finding about one unusually separable task as evidence for a general claim, and in treating the confidence of those who repeat a finding as though it were part of the evidence for it."], "qs": [{"stem": "Which of the following best expresses the main argument of the passage?", "o": ["The orchestra study has been asked to carry more than it can: its evidence is weaker than its fame, and its task unlike most hiring", "The orchestra study's estimates were too imprecise to show that screens helped women, so the value of the screens remains unproven", "Blind evaluation works only for tasks in which what is hidden is irrelevant to what is judged, as with music played behind a screen", "Orchestras should keep their screens though the study behind them was imprecise, since a hidden candidate cannot be judged on her looks"]}, {"stem": "Which of the following is the author most likely to disagree with?", "o": ["A precise result from the orchestras would still not show that anonymised applications work for a manager's post", "Training sessions that present the orchestra study as proof lean partly on its fame rather than on its evidence", "An orchestra that took down its screen would expose its committee to an influence irrelevant to the music", "Had the study found no effect at all, that would have been a good reason to take the screens down"]}, {"stem": "In the last paragraph the author says, 'None of this is a reason to take the screens down.' This position assumes that:", "o": ["before screens were introduced, orchestra committees had in fact been biased against the women who auditioned in front of them", "removing a possible source of bias can be worthwhile even when its effect cannot be measured with any precision", "screens cost orchestras very little to put up and keep in place, compared with the other costs of holding auditions", "later studies using much larger samples have since confirmed that the screens did raise women's chances of being hired"]}, {"stem": "Each of the following, if true, would weaken the position of those who cite the orchestra study as proof that blind evaluation removes bias in hiring of every kind EXCEPT:", "o": ["Re-analyses of the orchestra records using much larger samples found no reliable effect of the screens on women's chances", "In most professions, the qualities being judged show themselves only in the very exchanges that anonymised applications remove", "Orchestras using screens also carpeted the stage, so that a candidate's footsteps would not give her away", "Trials of anonymised applications in several public services found no gain in hiring for the groups expected to benefit"]}, {"stem": "Which of the following commits an error most similar to the one the author describes as treating 'a finding about one unusually separable task as evidence for a general claim'?", "o": ["Diners rate a wine higher when told it is costly, so a consultant concludes that hiding prices in every shop will make buyers judge on quality alone", "Diners rate a wine higher when told it is costly, so a panel that judges olive oils by taste is then given bottles with their prices covered up", "Ten diners in one restaurant rated a wine higher when told it was costly, so a writer concludes that diners everywhere are swayed by a wine's price", "People who exercise regularly sleep better than people who do not, so a gym advertises that exercise is what causes good sleep"]}]}, {"id": "p5", "label": "Passage V", "kind": "Case study: the outpatient queue", "text": ["Imagine you have been appointed to advise a district hospital whose outpatient department (OPD) has drawn complaints about waiting times since it introduced online appointments eight months ago. Your inquiries establish the following.", "• Before the change, patients collected a paper token at the gate from 8:00 a.m. and were seen in token order. Doctors consult from 9:00 a.m. to 1:00 p.m.", "• Patients now book online for one of two blocks, 9:00–11:00 or 11:00–1:00. Each doctor sees, on average, 22 patients an hour.", "• About a quarter of booked patients do not turn up. To make up for this, the hospital three months ago raised the bookings it accepts for each doctor in each block from 48 to 60. Waiting times rose most sharply after that.", "• Since online booking began, the median wait between arrival and consultation has risen from 70 to 95 minutes. Most booked patients arrive within fifteen minutes of the start of their block.", "• Patients without bookings are still seen, but only after all the booked patients present in a block have been seen; those not seen by 1:00 p.m. are asked to come back another day.", "• Registration now takes under three minutes per patient, against about ten minutes under the token system.", "• Doctors' attendance registers, checked by the medical superintendent, show that every doctor signs in by 9:00 a.m.", "• A private hospital nearby introduced online booking in the same month, with appointments in ten-minute slots and a booking fee of ₹50, which most of its patients' insurers refund. Its waiting times have fallen."], "qs": [{"stem": "Which of the following best explains why waiting times rose most sharply after the hospital raised its bookings to 60 per block?", "o": ["Booked patients arrive within fifteen minutes of their block's start, so most of them must wait for a long while as those ahead are seen", "Even after a quarter stay away, 60 bookings bring about as many patients as a doctor can see in a block, before any walk-ins", "The share of booked patients who stayed away may have risen once more bookings were taken, so that doctors were left idle for longer", "Patients without bookings, who are seen only after the booked ones, have had to wait longer since online booking began than under tokens"]}, {"stem": "Which difference between the two hospitals' booking systems most plausibly explains why their waiting times moved in opposite directions?", "o": ["The private hospital charges a fee for each booking, which may deter some patients from booking with it at all", "The private hospital's waiting times have fallen since it began taking bookings, while the district hospital's have risen", "The private hospital limits its bookings to fewer than its doctors can see, and so never has to turn walk-in patients away", "The private hospital spreads its booked patients' arrivals across ten-minute slots, while two-hour blocks bring them in together"]}, {"stem": "Which of the following, if true, would most weaken the claim that the online booking system is responsible for the longer waits?", "o": ["Median waits at three other district hospitals that also adopted two-hour booking blocks rose over the same months", "Waits at the hospital had been creeping up by a few minutes a year for a decade before online booking began", "Over the same eight months, the number of patients coming to the OPD rose by a third after a nearby clinic closed", "The rise in waiting times was largest among walk-in patients, who are seen only after all the booked patients in each block"]}, {"stem": "Which of the following would most effectively shorten waiting times without reducing the number of patients the OPD sees?", "o": ["Fifteen-minute slots, each booked with about seven patients, so that after no-shows roughly five arrive for every slot", "Half-hour slots, each booked with twenty-two patients, so that a doctor's hourly rate is matched within every slot", "Seeing walk-in patients before booked patients in each block, so that those who come without bookings do not wait so long", "Opening a second registration counter at the gate so that patients can be registered faster as they arrive each morning"]}, {"stem": "Waits had already begun to lengthen before the hospital raised its bookings to 60. Which of the following is LEAST likely to have contributed to the longer waits in those first five months?", "o": ["Doctors starting their consultations some time after they sign in at 9:00 a.m.", "Booked patients who turned up outnumbering what a doctor could see in a block", "Booked patients arriving together within minutes of the start of their block", "Walk-in patients having to wait until every booked patient present had been seen"]}]}]};

const P=DATA.passages, CODES=DATA.codes, QS=[];
P.forEach((p,pi)=>p.qs.forEach(q=>{ q.n=QS.length+1; q.pi=pi; QS.push(q); }));
const LIMIT=32*60*1000, L="abcd", TOTAL=QS.length, LSKEY="lrcrstepup-s1-current";
let REV=null;
function unseal(){ if(REV) return REV; const b=atob(SEAL), k="lrcr-step-up-sectional-1", out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i)^((k.charCodeAt(i%k.length)+i*7)%256);
  REV=JSON.parse(new TextDecoder().decode(out)); return REV; }

/* ------------------------------------------------------------------ STATE */
let S=null, db=null, view="start", past=[], saveTimer=null, tickTimer=null, lastTick=0, saveMsg="";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function newAttempt(){ return {id:"att-"+Date.now().toString(36), startedAt:Date.now(), status:"in_progress", answers:{}, flags:{}, passageMs:{}, changes:{}, firstAt:{}, cur:0}; }
function elapsed(st=S){ return st ? Math.min(LIMIT,(st.submittedAt||Date.now())-st.startedAt) : 0; }

function score(st){
  const R=unseal(); let r=0,w=0,u=0; const traps={}, per=[];
  QS.forEach(q=>{ const a=st.answers[q.n], k=R.key[q.n-1]; let t=null;
    if(!a) u++; else if(a===k) r++; else { w++; t=R.traps[q.n-1][a]; if(t) traps[t]=(traps[t]||0)+1; }
    per.push({n:q.n,picked:a||null,correct:k,trap:t}); });
  return {r,w,u,net:r-0.25*w,traps,per};
}

/* ------------------------------------------------------------------ PERSISTENCE */
function persistSoon(){ ls.set(LSKEY,S); clearTimeout(saveTimer); saveTimer=setTimeout(persistNow,1500); }
async function persistNow(){
  if(S&&S.status==="in_progress") ls.set(LSKEY,S);
  if(!db||!S) return;
  try{
    const body=JSON.parse(JSON.stringify(S));
    if(S.status==="submitted"){ const sc=score(S); body.result={right:sc.r,wrong:sc.w,unanswered:sc.u,net:sc.net,traps:sc.traps,perQuestion:sc.per,timeMs:elapsed()}; }
    await db.collection("attempts").doc(S.id).set(body);
    saveMsg="Saved"; paintSaved();
  }catch(e){ saveMsg= e&&e.code==="quota_exceeded" ? "Storage full: kept in this browser only" : "Saved in this browser"; paintSaved(); }
}
function paintSaved(){ const el=document.getElementById("saved"); if(el) el.textContent=saveMsg; }
async function loadPast(){
  if(!db) return;
  try{ const snap=await db.collection("attempts").orderBy("startedAt","desc").limit(20).get();
    past=snap.docs.map(d=>d.data()).filter(Boolean); if(view==="start") render(); }catch(e){}
}

/* ------------------------------------------------------------------ RENDER */
function render(){ if(view==="start") return renderStart(); if(view==="test") return renderTest(); if(view==="result") return renderResult(); }

function renderStart(){
  const local=ls.get(LSKEY);
  const resume=(local&&local.status==="in_progress")?local:(past.find(a=>a.status==="in_progress")||null);
  const done=past.filter(a=>a.status==="submitted"&&a.result);
  const left=resume?LIMIT-(Date.now()-resume.startedAt):0;
  app.innerHTML=`<div class="gut"><div class="wrap"><div class="intro">
    <div class="stack">
      <p class="eyebrow">LR-CR series · Step-Up Sectional · one step above CL mocks</p>
      <h1>LR-CR Step-Up Sectional</h1>
      <p style="font:17px/1.6 var(--f-read);max-width:62ch">Three argument passages, a deduction set built on the CLAT 2026 investigation template and a consultant case in the CLAT 2024 and 2025 form: 26 questions on author-agree, assumption, weaken, must-be-true, most similar, resolve the conundrum, strengthen, 'based only on the author's statement', most effective course of action, which fact must be incorrect, flaw, necessary condition, root cause, critical difference and least likely cause. The traps are the ones in your CL mock misses: assumptions that help but are not needed, one possible route offered as a 'must', wrong-target weakeners, raw clock times and EXCEPT reversals.</p>
      <div class="facts">
        <div class="fact"><b>26</b><span>5 sets: 4 × 5 and 1 × 6</span></div>
        <div class="fact"><b>32:00</b><span>hard limit; submits itself at zero</span></div>
        <div class="fact"><b>+1 / −0.25</b><span>blank scores 0</span></div>
      </div>
      <div class="plist">${P.map((p,i)=>`<b>P${i+1}</b><span>${esc(p.kind)}</span>`).join("")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${resume&&left>0?`<button class="btn primary" id="resume">Resume (${fmt(left)} left)</button><button class="btn" id="fresh">Start a fresh attempt</button>`:`<button class="btn primary" id="start">Start the clock</button>`}
      </div>
    </div>
    <div class="sheet">
      <h3>Before you start</h3>
      <ol class="rules">
        <li>The clock runs for 32 minutes and submits your answers when it reaches zero. A reload does not stop it.</li>
        <li>Answers and flags save as you go, so a reload or a dropped connection won't lose them.</li>
        <li>Submit asks you to confirm. Answers, explanations and trap codes appear only after that.</li>
        <li>Each wrong answer is tagged with the trap it fell for, using the codes from your CL mock error log.</li>
      </ol>
      ${done.length?`<div class="past"><p class="eyebrow">Previous attempts</p>${done.slice(0,5).map(a=>`<div><span>${new Date(a.startedAt).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span><span>${Number(a.result.net).toFixed(2)} / ${TOTAL} · ${a.result.right} right · ${a.result.wrong} wrong · ${fmt(a.result.timeMs)}</span></div>`).join("")}</div>`:""}
    </div>
  </div></div></div>`;
  const go=st=>{ S=st; view="test"; render(); persistNow(); startTick(); window.scrollTo({top:0}); };
  document.getElementById("start")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("fresh")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("resume")?.addEventListener("click",()=>go(resume));
}

const answeredIn=pi=>P[pi].qs.filter(q=>S.answers[q.n]).length;
const flaggedIn=pi=>P[pi].qs.filter(q=>S.flags[q.n]).length;

function renderTest(){
  const p=P[S.cur], answered=Object.keys(S.answers).length;
  app.innerHTML=`<div class="bar"><div class="bar-in gut">
      <span class="clock" id="clock" role="timer" aria-label="Time left">32:00</span>
      <span class="count" id="count">${answered}/${TOTAL} answered</span>
      <nav class="tabs" aria-label="Passages">${P.map((x,i)=>`<button class="tab" data-p="${i}" aria-current="${i===S.cur}">P${i+1}<span class="n">${answeredIn(i)}/${x.qs.length}</span>${flaggedIn(i)?`<span class="fl" title="flagged">⚑${flaggedIn(i)}</span>`:""}</button>`).join("")}</nav>
      <span class="spacer"></span><span class="saved" id="saved">${esc(saveMsg)}</span>
      <button class="btn danger" id="submit">Submit</button>
    </div></div>
    <div class="gut"><div class="wrap" style="padding-top:0">
      <div id="confirmBox"></div>
      <div class="test">
        <article class="passage" aria-label="${esc(p.label)}">
          <div class="head"><p class="eyebrow">${esc(p.kind)}</p><h2>${esc(p.label)}</h2></div>
          <div class="body">${p.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
        </article>
        <section class="qs" aria-label="Questions">${p.qs.map(qCard).join("")}
          <div class="navrow">${S.cur>0?`<button class="btn" id="prev">← Passage ${S.cur}</button>`:"<span></span>"}${S.cur<P.length-1?`<button class="btn primary" id="next">Passage ${S.cur+2} →</button>`:`<button class="btn danger" id="submit2">Submit</button>`}</div>
        </section>
      </div>
    </div></div>`;
  app.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchP(+b.dataset.p)));
  document.getElementById("prev")?.addEventListener("click",()=>switchP(S.cur-1));
  document.getElementById("next")?.addEventListener("click",()=>switchP(S.cur+1));
  ["submit","submit2"].forEach(id=>document.getElementById(id)?.addEventListener("click",askSubmit));
  app.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>pick(+r.dataset.q,r.value)));
  app.querySelectorAll(".flag").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; S.flags[n]=!S.flags[n]; persistSoon(); renderTest(); }));
  app.querySelectorAll(".clear").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; delete S.answers[n]; persistSoon(); renderTest(); }));
  tickClock();
}

function stemHTML(q){
  const st=q.stmts?`<div class="stmts">${q.stmts.map((t,i)=>`<div><b>${esc(q.stmtLabels[i])}</b><span>${esc(t)}</span></div>`).join("")}</div>`:"";
  return (q.quote?`<p class="stem">${esc(q.stem)}</p><div class="quote">${esc(q.quote)}</div>${q.after?`<p class="stem">${esc(q.after)}</p>`:""}`:`<p class="stem">${esc(q.stem)}</p>`)+st;
}
function qCard(q){
  const a=S.answers[q.n];
  return `<div class="q" id="q${q.n}">
    <div class="top"><span class="qn">Q${q.n}</span><button class="flag" data-q="${q.n}" aria-pressed="${!!S.flags[q.n]}">${S.flags[q.n]?"⚑ Flagged":"⚐ Flag"}</button></div>
    ${stemHTML(q)}
    <div class="opts" role="radiogroup" aria-label="Question ${q.n}">${q.o.map((t,i)=>{const l=L[i];return `<label class="opt${a===l?" sel":""}"><input type="radio" id="q${q.n}${l}" name="q${q.n}" value="${l}" data-q="${q.n}"${a===l?" checked":""}><span class="L">${l}</span><span>${esc(t)}</span></label>`}).join("")}</div>
    ${a?`<button class="clear" data-q="${q.n}">Clear answer</button>`:""}
  </div>`;
}
function pick(n,l){
  if(!S||S.status!=="in_progress") return;
  if(S.answers[n]&&S.answers[n]!==l) S.changes[n]=(S.changes[n]||0)+1;
  if(!S.firstAt[n]) S.firstAt[n]=Date.now()-S.startedAt;
  S.answers[n]=l;
  const card=document.getElementById("q"+n);
  if(card){ card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").value===l));
    if(!card.querySelector(".clear")){ const b=document.createElement("button"); b.className="clear"; b.dataset.q=n; b.textContent="Clear answer"; b.addEventListener("click",()=>{ delete S.answers[n]; persistSoon(); renderTest(); }); card.appendChild(b);} }
  const cnt=document.getElementById("count"); if(cnt) cnt.textContent=Object.keys(S.answers).length+"/"+TOTAL+" answered";
  app.querySelectorAll(".tab").forEach((b,i)=>{ const s=b.querySelector(".n"); if(s) s.textContent=answeredIn(i)+"/"+P[i].qs.length; });
  persistSoon();
}
function switchP(i){ accrue(); S.cur=i; persistSoon(); renderTest(); window.scrollTo({top:0}); }
function accrue(){ const now=Date.now(); if(lastTick&&view==="test"&&S&&!document.hidden){ const k=P[S.cur].id; S.passageMs[k]=(S.passageMs[k]||0)+(now-lastTick);} lastTick=now; }
function startTick(){ clearInterval(tickTimer); lastTick=Date.now(); tickTimer=setInterval(()=>{ accrue(); tickClock(); },1000); }
function tickClock(){
  if(!S||view!=="test") return;
  const left=LIMIT-(Date.now()-S.startedAt);
  if(left<=0){ submit(true); return; }
  const el=document.getElementById("clock"); if(!el) return;
  el.textContent=fmt(left); el.classList.toggle("low",left<5*60*1000);
}
function askSubmit(){
  const un=TOTAL-Object.keys(S.answers).length, fl=Object.values(S.flags).filter(Boolean).length;
  const box=document.getElementById("confirmBox");
  box.innerHTML=`<div class="confirm" role="alertdialog" aria-label="Confirm submission"><p><b>Submit now?</b> ${un} unanswered${fl?`, ${fl} flagged`:""}. You can't change answers after this.</p><span class="spacer"></span><button class="btn" id="keep">Keep working</button><button class="btn danger" id="really">Submit and see results</button></div>`;
  box.scrollIntoView({block:"nearest"});
  document.getElementById("keep").addEventListener("click",()=>box.innerHTML="");
  document.getElementById("really").addEventListener("click",()=>submit(false));
}
function submit(auto){
  if(!S||S.status!=="in_progress") return;
  accrue(); clearInterval(tickTimer);
  S.status="submitted"; S.auto=!!auto; S.submittedAt=auto?Math.min(Date.now(),S.startedAt+LIMIT):Date.now();
  ls.del(LSKEY); view="result"; persistNow(); render(); window.scrollTo({top:0}); loadPast();
}

function renderResult(){
  const R=unseal(), sc=score(S), t=elapsed();
  const trapRows=Object.entries(sc.traps).sort((a,b)=>b[1]-a[1]); const maxT=Math.max(1,...trapRows.map(x=>x[1]));
  const pRows=P.map(p=>{ const qs=p.qs; const r=qs.filter(q=>S.answers[q.n]===R.key[q.n-1]).length, w=qs.filter(q=>S.answers[q.n]&&S.answers[q.n]!==R.key[q.n-1]).length;
    return `<tr><td>${esc(p.label)} · ${esc(p.kind)}</td><td class="n">${r}</td><td class="n">${w}</td><td class="n">${qs.length-r-w}</td><td class="n">${fmt(S.passageMs[p.id]||0)}</td></tr>`; }).join("");
  app.innerHTML=`<div class="gut"><div class="wrap stack">
    <div class="stack" style="gap:8px"><p class="eyebrow">Result · ${new Date(S.startedAt).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p>
      <h1>${sc.net.toFixed(2)} out of ${TOTAL}</h1>
      <p class="muted">Time taken ${fmt(t)} of 32:00${S.auto?" · submitted automatically when time ran out":""}</p></div>
    <div class="scorehead">
      <div class="stat"><b>${sc.r}</b><span>right (+${sc.r})</span></div>
      <div class="stat"><b>${sc.w}</b><span>wrong (−${(0.25*sc.w).toFixed(2)})</span></div>
      <div class="stat"><b>${sc.u}</b><span>blank (0)</span></div>
      <div class="stat"><b>${sc.r+sc.w?Math.round(100*sc.r/(sc.r+sc.w)):0}%</b><span>accuracy on attempted</span></div>
    </div>
    <div class="intro" style="padding-top:0">
      <div class="sheet"><h3>Traps you fell for</h3>
        ${trapRows.length?`<div class="traps">${trapRows.map(([c,n])=>`<div class="trap"><span class="code">${c}</span><div><div style="font-weight:500">${esc(CODES[c][0])}</div><div class="muted" style="font-size:13px">${esc(CODES[c][1])}</div><div class="tbar" style="width:${Math.max(8,100*n/maxT)}%;margin-top:4px"></div></div><b style="font-family:var(--f-mono)">${n}</b></div>`).join("")}</div>`:`<p>No traps sprung. Every answer you gave was right.</p>`}
        <p class="muted" style="font-size:13px">Send me your time and the questions you got wrong or skipped, with what you marked, and I'll aim the next LR-CR sectional at the pattern.</p>
      </div>
      <div class="ptable"><table><thead><tr><th>Passage</th><th style="text-align:right">Right</th><th style="text-align:right">Wrong</th><th style="text-align:right">Blank</th><th style="text-align:right">Time</th></tr></thead><tbody>${pRows}</tbody></table></div>
    </div>
    <div class="stack" style="gap:10px"><h2>Every question, marked</h2>
      <div class="review">${P.map(p=>`<details class="pz"><summary>${esc(p.label)}: re-read the passage</summary><div style="font:15px/1.65 var(--f-read);display:flex;flex-direction:column;gap:8px;padding:8px 2px">${p.text.map(x=>`<p>${esc(x)}</p>`).join("")}</div></details>`+p.qs.map(q=>rCard(q,R)).join("")).join("")}</div>
    </div>
    <div><button class="btn" id="home">Back to start</button></div>
  </div></div>`;
  document.getElementById("home").addEventListener("click",()=>{ view="start"; S=null; render(); loadPast(); });
}
function rCard(q,R){
  const i=q.n-1, a=S.answers[q.n], k=R.key[i], st=!a?"u":a===k?"r":"w", tr=R.traps[i], code=st==="w"?tr[a]:null;
  return `<div class="rq ${st}">
    <div class="rtop"><span class="qn">Q${q.n} · ${esc(P[q.pi].label)} · ${esc(R.type[i])}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${st==="r"?`<span class="pill r">Right</span>`:st==="u"?`<span class="pill u">Blank · answer ${k}</span>`:`<span class="pill w">You: ${a} · answer ${k} · Trap ${code}: ${esc(CODES[code][0])}</span>`}${S.changes[q.n]?`<span class="pill">changed ${S.changes[q.n]}×</span>`:""}</span></div>
    ${stemHTML(q)}
    <div class="opts">${q.o.map((t,j)=>{const l=L[j];const cls=l===k?"ans":(l===a?"bad":"");const tag=l===k?`<span class="pill r">key</span>`:`<span class="pill">${tr[l]}</span>`;return `<div class="ro ${cls}"><b>${l}</b><span>${esc(t)}</span>${tag}</div>`}).join("")}</div>
    <div class="why"><p>${esc(R.why[i])}</p>
      <details class="ex"${st==="w"?" open":""}><summary>Why each option is right or wrong</summary><ul>${L.split("").map(l=>`<li><b>${l}${l===k?" (key)":" · "+tr[l]}</b>: ${esc(R.reasons[i][l])}</li>`).join("")}</ul></details>
      <p class="muted" style="font-size:13px">Modelled on: ${esc(R.src[i])}</p></div>
  </div>`;
}

/* ------------------------------------------------------------------ BOOT */
document.addEventListener("visibilitychange",()=>{ if(view==="test"){ accrue(); if(document.hidden) persistNow(); }});
function start(data){
  if(data&&data.S){ S=data.S; view=data.view||"start"; }
  else { const local=ls.get(LSKEY);
    if(local&&local.status==="in_progress"&&Date.now()-local.startedAt>=LIMIT){ S=local; view="test"; submit(true); } }
  render();
  if(view==="test") startTick();
  (async()=>{ try{ db=window.claude?await window.claude.use("db"):null; }catch(e){ db=null; }
    if(db){ await loadPast();
      if(view==="start"){ const open=past.find(a=>a.status==="in_progress"&&!ls.get(LSKEY));
        if(open&&Date.now()-open.startedAt>=LIMIT){ S=open; view="test"; submit(true); } }
      else if(S) persistNow(); } })();
}
window.claude?.hot?.snapshot?.(()=>({S,view}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
