<style>
/* Layout: exam booklet. Sticky invigilator bar with the clock; the passage (reading face) beside its question column; results as a marked script. Deep teal marks the RC step-up series. */
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#1a2230; --muted:#5a6676; --rule:#d5dbe3;
  --accent:#1f5f5b; --accent-soft:#e1efec; --accent-ink:#ffffff;
  --right:#2a7a4d; --right-soft:#e1f1e7; --wrong:#b23f37; --wrong-soft:#f7e3e0; --skip:#9a6b0c; --skip-soft:#f6ecd5;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141b; --paper:#171c25; --ink:#e4e9f0; --muted:#97a3b3; --rule:#2a3240;
  --accent:#7fcfc4; --accent-soft:#16302d; --accent-ink:#0d121a;
  --right:#63c48c; --right-soft:#152d20; --wrong:#ee8a80; --wrong-soft:#3a1e1b; --skip:#e2b250; --skip-soft:#33290f;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#171c25; --ink:#e4e9f0; --muted:#97a3b3; --rule:#2a3240;
  --accent:#7fcfc4; --accent-soft:#16302d; --accent-ink:#0d121a;
  --right:#63c48c; --right-soft:#152d20; --wrong:#ee8a80; --wrong-soft:#3a1e1b; --skip:#e2b250; --skip-soft:#33290f;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 clamp(28px,4.4vw,40px)/1.15 var(--f-read)}
h2{font:600 22px/1.25 var(--f-read)}
h3{font:600 15px/1.35 var(--f-ui)}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--wrong);color:var(--paper);border-color:var(--wrong)}
.stack{display:flex;flex-direction:column;gap:20px}
/* start */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:18px}
.intro > *{min-width:0}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.fact b{display:block;font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.plist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.plist b{font:500 12px/1.9 var(--f-mono);color:var(--muted)}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.past{display:flex;flex-direction:column;gap:6px;font-size:14px}
.past div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:6px;font-variant-numeric:tabular-nums}
/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.clock{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:76px}
.clock.low{color:var(--wrong)}
.count{font:500 13px var(--f-mono);color:var(--muted)}
.spacer{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 11px;font:500 12px/1.5 var(--f-mono);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{opacity:.75}
.tab .fl{color:var(--skip)}
.tab[aria-current="true"] .fl{color:inherit}
.saved{font:12px var(--f-mono);color:var(--muted)}
/* test */
.test{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;padding-top:18px}
.test > *{min-width:0}
.passage{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 24px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 96px);overflow:auto}
.passage .head{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.passage .body{font:16.5px/1.72 var(--f-read);display:flex;flex-direction:column;gap:12px;max-width:68ch}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qn{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.stem{font-weight:500}
.quote{font:15.5px/1.6 var(--f-read);background:var(--bg);border-radius:8px;padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.stmts{display:flex;flex-direction:column;gap:6px;font:15px/1.6 var(--f-read);background:var(--bg);border-radius:8px;padding:10px 12px}
.stmts div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.stmts b{font:500 12.5px/1.95 var(--f-mono);color:var(--muted)}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--paper);position:relative}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .L{font:500 13px/1.6 var(--f-mono);width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.flag{border:0;background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer;padding:2px 4px}
.flag[aria-pressed="true"]{color:var(--skip)}
.clear{border:0;background:none;color:var(--muted);font:12px var(--f-ui);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.confirm{background:var(--skip-soft);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
/* results */
.scorehead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.traps{display:flex;flex-direction:column;gap:8px}
.trap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.code{font:600 13px var(--f-mono);width:30px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--wrong-soft);color:var(--wrong)}
.tbar{height:8px;border-radius:4px;background:var(--wrong);opacity:.85}
.review{display:flex;flex-direction:column;gap:12px}
.rq{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rq.r{border-left-color:var(--right)} .rq.w{border-left-color:var(--wrong)} .rq.u{border-left-color:var(--skip)}
.rtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ro{font-size:14px;padding:6px 8px;border-radius:6px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:start}
.ro.ans{background:var(--right-soft)} .ro.bad{background:var(--wrong-soft)}
.ro b{font-family:var(--f-mono)}
.pill{font:500 11px/1.5 var(--f-mono);padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;align-self:start}
.pill.w{background:var(--wrong-soft);color:var(--wrong)} .pill.r{background:var(--right-soft);color:var(--right)} .pill.u{background:var(--skip-soft);color:var(--skip)}
.why{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details.pz summary,details.ex summary{cursor:pointer;color:var(--muted);font-size:13px}
.ptable{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left}
th{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.banner{background:var(--skip-soft);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14px}
@media (max-width:860px){
  .intro,.test{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .scorehead{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){ .opt{transition:background .12s,border-color .12s} }

const DATA={"codes": {"A": ["Added idea", "Brings in a cause, motive, fact or remedy the passage never gives, often one that is plausible in the real world."], "B": ["Too broad", "Turns this case into a rule about everything of its kind."], "C": ["Correlation read as cause", "Treats an association, or a change caused by something else, as proof of the cause in question."], "E": ["NOT / EXCEPT reversal", "This option is supported (or does what the stem says the others do). Picking it means reading NOT or EXCEPT as if it were not there."], "F": ["Word or figure misread", "The dictionary sense instead of the sense in context, a sound-alike, or the wrong figure of speech (simile vs metaphor vs personification)."], "L": ["Mix-up or reversal", "Swaps two things the passage keeps apart, contradicts a stated line, or helps the argument when the stem asks you to hurt it."], "O": ["Half-right option", "One half fits (often a word that echoes the passage); the other half, or the 'because' clause, is false."], "P": ["Part, not the whole", "True of one paragraph, one example or one cause, but not of the whole passage or the whole effect asked about."], "R": ["Rival view or echo", "The view the author reports or rejects, or the passage's own words with the meaning shifted."], "S": ["The narrator taken at his word", "In fiction: accepts the narrator's own reading of events where the passage invites the reader to see past it."], "T": ["Wrong target", "Bears on a side claim, a different mechanism or the outcome rather than the point the question names."], "X": ["Unearned absolute", "Needs 'only / every / never / always / no bearing at all', or turns the passage's 'may' into a fact. The passage never earns it."]}, "passages": [{"id": "p1", "label": "Passage I", "kind": "Fiction: the magistrate's clock", "text": ["The clock arrived from Calcutta in the second week of my posting, packed in straw and accompanied by a letter from the makers assuring me that it would neither gain nor lose a minute in a year. I had it hung on the wall opposite my table, where a petitioner could see it as plainly as I could. It was, I told my peshkar, the most impartial officer in the subdivision: it gave the zamindar's agent and the cultivator precisely the same seven minutes, and it could be bribed by neither.", "I mention the clock because it explains, better than any account of my temperament, why I have never been accused of impatience. Before it came, a petitioner who wept was heard for longer than one who did not, and the importunate for longer than the patient; I had begun to suspect that the subdivision had learned this. After it came, tears and silence were weighed alike. I do not say that the arrangement was popular. I say that it was fair, which is a different and, I think, a higher thing.", "The old woman came on a Tuesday, in the heat of the afternoon, when the punkah-puller on the verandah had begun to doze and the punkah with him. She had walked, the peon told me, from a village eleven miles off, beyond the second bend of the river. She did not sit until I asked her to, and then she sat on the very edge of the bench, as if she expected to be asked to rise again.", "Her business, when she reached it, concerned a strip of land that the river had left behind when it last changed its course, and that the recent survey had entered in a neighbour's name. But she did not reach it at once. She began with her husband, who had planted a mango sapling on the new silt the year the water turned, and with the sapling, which had borne fruit for the first time in the year he died. I let her go on. I have always held that a petitioner should be allowed to arrive at her point by her own road, provided she arrives within the time.", "At the sixth minute I glanced at the clock, and she saw me glance, and she hurried, which I regretted. At the seventh I raised my hand. I explained, as gently as the language allows, that a correction of the record of rights must be applied for in writing, on stamped paper, through the proper office, and that the peshkar would tell her the fee. She folded her hands and thanked me. Then she untied from the end of her sari a small earthen pot sealed with a leaf, and set it on the corner of my table. 'Date-palm gur,' said the peon, before I could ask.", "I told her, kindly but plainly, that the court could accept nothing; that this was precisely the custom the administration had set itself to end; that her case would be decided on its merits or not at all. She listened with great attention, as though committing the words to memory. 'My husband never went to the court with empty hands,' she said at last. 'One does not go to anybody's house with empty hands.' Then she rose and went out, and when the peon ran after her with the pot she would not take it back, so that it stood on the verandah bench for the rest of the afternoon, collecting ants.", "That evening I wrote in my diary that the subdivision would learn, in time, that its magistrate could not be sweetened. I noted also, as a matter of no great consequence, that the Calcutta clock had been found to gain some four minutes in the day; it had been set right on Monday and would be set right again. The peshkar, when I mentioned the old woman, said that she had come every year after the harvest for three years, but had never before brought the stamp fee, and so had always been sent home from his table without reaching mine: a small mercy, I reflected, since it had spared her the expense of being refused by me. I could not help admiring the persistence of such people, though persistence, as I have often said, is no substitute for procedure."], "qs": [{"stem": "The narrator's account of his meeting with the old woman most strongly highlights which of the following?", "o": ["The conflict between a magistrate's sympathy for the poor and the rigid rules that his office obliges him to enforce", "How a rule applied evenly inside the courtroom can leave unexamined the barriers that decide who ever gets to reach it", "The corruption of a colonial court in which petitions succeed through gifts and fees rather than on their merits", "The deceptive nature of appearances, since a humble widow turns out to be a shrewd and persistent litigant"]}, {"stem": "Which literary device is most evident in the narrator's reflection that the peshkar's sending her home was 'a small mercy, … since it had spared her the expense of being refused by me'?", "o": ["Euphemism, because the narrator deliberately picks a gentle word to hide from himself what the peshkar had done to her", "Understatement, because the narrator calls 'small' a mercy that had in truth spared a poor widow three years of costly journeys", "Sarcasm, because the narrator is openly mocking his peshkar for sending a petitioner away before she could reach the court", "Irony, because he counts as a kindness the practice that had kept her, year after year, from being heard"]}, {"stem": "In his diary the narrator writes that 'the subdivision would learn, in time, that its magistrate could not be sweetened'. As used here, 'sweetened' most nearly means:", "o": ["won over by a gift, the word playing on the pot of gur that he had just refused", "made gentler in his manner, since he had spoken to her 'kindly but plainly' and had regretted her hurry", "moved by tears, since his clock had already taught the subdivision that weeping earned no extra minutes", "softened by her story of her husband, as the gifts her husband once brought had softened the court"]}, {"stem": "The old woman's refusal to take back the pot of gur most strongly suggests that she:", "o": ["hoped that the gift, once tasted, would persuade the magistrate to look on her petition rather more kindly", "had not understood the magistrate's explanation, since he had spoken to her in a language she did not know", "regarded the gift as a courtesy owed to any house she visited, not as payment for a favour", "wished to shame the magistrate openly for refusing a gift that her husband had always been allowed to give"]}, {"stem": "Which of the following best describes the tone of the narrator in the last paragraph of the passage?", "o": ["Self-approving and complacent, because he presents his refusal of her gift and his procedure as virtues, and the clock's fault as a trifle", "Ironic and self-mocking, because he sees the joke in having trusted a clock that turned out to gain four minutes a day", "Detached and analytical, because he sets down the day's events in his diary as a record rather than as a judgment", "Remorseful and uneasy, because he concedes that his clock, like his peshkar, may in some way have failed her"]}, {"stem": "The peshkar says that the old woman 'had never before brought the stamp fee'. Read with the rest of the passage, this most strongly suggests that:", "o": ["she had saved for three years to raise the fee, which is why she could bring only a small pot of gur as her gift", "the narrator mistook the money she brought this year for a bribe, just as he mistook the pot of gur she left behind", "this year she had at last reached the magistrate, so that her claim could be decided on its merits, as he had promised", "this year she had met the condition that always turned her back, only to be sent to the peshkar to learn the fee"]}]}, {"id": "p2", "label": "Passage II", "kind": "History: the census and caste", "text": ["It has become a commonplace that the British did not find caste in India so much as manufacture it, and that the census was the factory. From the first all-India count of 1871–72 to the far more elaborate operation of 1901, officials asked every household to name its caste, sorted the answers into tables and printed them in volumes that district officers consulted as though they were maps. What had been a loose and locally negotiated set of identities, the argument runs, was hardened into a rigid hierarchy by men with ledgers.", "The commonplace contains a truth and a condescension. The truth lies in what the act of counting did to the thing counted. Before the census, a man might describe himself one way to a landlord, another to a priest and a third to a marriage broker, and none of these descriptions needed to agree with the others, since no single authority asked for all of them at once. The census asked once, of everybody, and wrote the answer down. A label that had been one move in a running negotiation became an entry in a register, and a register, unlike a reputation, could be cited. When Herbert Risley, who directed the census of 1901, set out to arrange the castes of each province in order of 'social precedence as recognised by native public opinion', he turned a question that every village had answered differently into one that each province would answer once.", "The condescension lies in the picture of Indians as the passive raw material of this process. The order of precedence had scarcely been proposed before petitions began to arrive in large numbers from caste associations that wished to be entered under a different name or placed on a higher rung. Groups recorded as cultivators asked to be listed as Kshatriyas; others produced genealogies that traced them to ancient sages. The petitioners did not dispute that a ranking was possible; they disputed where they stood in it, and in doing so they took up the census as an instrument rather than suffering it as an imposition. Some of the associations that drafted those petitions had been formed for the purpose, and outlived it, going on to found schools, publish journals and, in time, contest elections.", "It does not follow that the census merely recorded what was already there. Risley believed that physical measurement, the breadth of the nose above all, could reveal the racial origins of a caste and so confirm its rank, and the authority of the printed tables lent that belief a respectability it did not deserve. Nor were the petitioners free to invent any category they pleased; they could choose only among the rungs that the census had built. The Indians who used the census were shaped by it in the very act of using it, and the officials who designed it found their categories bent by the uses to which they were put. To ask which party made modern caste is to ask a question whose form already concedes too much to one of the answers.", "What the episode does suggest is that an enumeration is never simply a looking-glass. To count a category is to give people a reason to belong to it, to leave it or to quarrel over its edges, and each count will record, among other things, the effects of the one before. As India prepares to count caste once again, those who expect the figures to settle old arguments and those who fear that the figures will create new divisions may both be underestimating how much the counted will have to say about the count."], "qs": [{"stem": "Which of the following best captures the central idea of the passage?", "o": ["The census did not invent caste but recorded it, and those who petitioned it sought only their rightful place in an order that already existed", "Counting changed caste and Indians bent the count in turn, so the coming caste census will deepen divisions rather than settle any argument", "Counting caste changed what caste was, but those counted used and bent the count, so neither 'invention' nor 'record' fits", "Colonial counting hardened fluid identities into fixed ranks, and Indian petitioners, by accepting the ranks, finished what the officials began"]}, {"stem": "According to the passage, why did a man's answer to the census bind him in a way that his earlier descriptions of himself had not?", "o": ["It was put to everyone by one authority and written down, so it could be held against later claims, unlike accounts that varied with the listener", "It was ranked by Risley against the answers of every other caste in the province, so that its place could no longer differ from village to village", "It placed him on a rung of an all-India order of castes, from which no later negotiation with his neighbours could move him", "It was the first occasion on which any authority had asked him which caste he belonged to at all"]}, {"stem": "Which of the following can be most reasonably inferred from the third paragraph?", "o": ["The petitioners rejected the census's right to rank them but accepted its right to decide the names they were listed under", "Groups placed high in the order of precedence accepted the ranking more readily than the groups that were placed low in it", "Most of the caste associations active in the early twentieth century had been formed in order to petition the census", "By contesting only their own place in the ranking, the petitioners helped to entrench the very idea of a single ranking"]}, {"stem": "The author writes that 'a register, unlike a reputation, could be cited'. The contrast turns chiefly on the fact that:", "o": ["a register belongs to the state while a reputation belongs to the community, so that only a register carries the force of law", "a written entry stays fixed and can be appealed to, whereas standing among neighbours shifts with audience and occasion", "a register records the truth about a person, whereas a reputation often rests on rumour and so is likely to be mistaken", "a register can be consulted by anyone at any time, whereas a reputation is known only to those who live close by"]}, {"stem": "Which of the following is NOT supported by the passage?", "o": ["Risley's ranking tried to settle, for a whole province at once, an order that had varied from one village to the next", "Some of the associations formed to petition the census went on working long after their petitions had been made", "The petitions of 1901 were the first occasion on which caste groups tried to change how officials recorded them", "The petitioners' room to redefine themselves was limited to the categories that the census itself had laid down"]}, {"stem": "Which of the following situations would the author most likely regard as an example of the claim that 'an enumeration is never simply a looking-glass'?", "o": ["After a state announces that dialects with a million recorded speakers will be taught in schools, the next count shows a sharp rise in speakers of one dialect", "A survey of the trees in a forest finds fewer species than an earlier survey had found, because the earlier survey had wrongly identified several of them", "A city's count of street vendors falls well short of the true number, because the count was held on a day when many vendors were away at a fair", "A census finds literacy rising across a district after the government opens new schools there, and the rise is largest where most schools opened"]}]}, {"id": "p3", "label": "Passage III", "kind": "Science: why organisms age", "text": ["For much of the twentieth century the simplest explanation of ageing was also the most popular. Organisms, it held, are like candles: each has a fixed quantity of something to burn, and those that burn it faster go out sooner. The 'rate-of-living' theory, named by the biologist Raymond Pearl in the 1920s, seemed to account for an obvious pattern: small mammals, whose hearts race and whose cells burn energy quickly, tend to die young, while elephants and whales, which live slowly, live long. Later versions identified the something as the damage done to cells by the reactive forms of oxygen that metabolism leaves behind.", "The pattern does not survive a wider sample. Birds burn energy faster than mammals of the same size and keep their bodies hotter, yet a pigeon can outlive a rat of similar weight several times over; bats, which power their flight with some of the highest metabolic rates measured in any mammal, live far longer than mice. If the candle burned in proportion to its flame, these animals should be among the shortest-lived of all. Whatever metabolic rate explains, it cannot explain why the creatures that burn fastest include some of the longest-lived.", "A different kind of explanation had meanwhile taken shape, one that asks not how bodies wear out but why natural selection has not stopped them from doing so. In the wild, most animals die of predation, disease, starvation or accident long before they can grow old. Genes whose harmful effects appear only late in life are therefore rarely exposed to selection, since few of their carriers live long enough to suffer them, and such genes accumulate. Genes that help early in life and harm later are actively favoured, because the early benefit is collected by nearly every carrier and the late cost by almost none. On this view ageing is not a programme but a neglect: a decline that selection has had too little reason to oppose. The theory predicts that where external dangers are fewer, selection can 'see' further into later life, and ageing should be postponed. Birds and bats, which can fly from many of their predators, fit the prediction, and so did a celebrated comparison of opossums on an island off the coast of Georgia, free of the predators their mainland relatives faced, which were found to age more slowly by physiological measures, not merely to die later.", "The neatness has not lasted. When guppies from Trinidadian streams were compared, fish from sites crowded with predators did not, as the theory seemed to require, age sooner than fish from sites with few; by some measures they aged later. One reply is that predators do not kill at random. If they take the slow and the weak, then surviving to old age in a dangerous stream requires the very vigour that delays decline, and selection under predation will favour bodies that stay sound. Another reply is that predation thins a population and leaves its survivors better fed. Both replies may be right, but they make the original prediction harder to state: it now holds only where the dangers that cut lives short strike without regard to an animal's condition and leave the survivors no better off.", "None of this restores the candle. The evolutionary account remains the only one on offer that explains why ageing exists at all, but it has turned out to be a framework rather than a forecast, compatible with many outcomes once the details of mortality are known, and those details are rarely known in advance. That is not quite a defect, since the shape of a population's dangers is a fact about its history rather than about the theory; but it does mean that the island opossums confirmed less than was once supposed, and the guppies refuted less."], "qs": [{"stem": "Which of the following best captures the central idea of the passage?", "o": ["The evolutionary account of ageing has displaced the rate-of-living theory, but the guppy studies have since shown its central prediction to be false", "Ageing is best understood as selection's neglect of late life, a framework whose predictions turn on how exactly a population's dangers fall on it", "Animals that are able to escape their predators, such as birds, bats and island opossums, age more slowly than animals that cannot", "Metabolic rate largely governs lifespan within groups of similar animals, while evolution mainly explains the differences between such groups"]}, {"stem": "According to the passage, why are genes that help early in life but harm later actively favoured by selection?", "o": ["Because their late harms are hidden from selection, so that they build up in a population without being opposed", "Because most of their carriers in the wild die before the late cost falls due, so that selection gives that cost little weight", "Because selection favours whatever helps the old give way to the young once they have reproduced", "Because a benefit that comes while nearly all carriers are alive outweighs a cost that comes when few are left to bear it"]}, {"stem": "The passage develops its argument in which of the following sequences?", "o": ["An intuitive theory is stated and undone by counter-examples; a rival is set out and supported; a later finding refutes the rival; the first theory is partly revived", "An intuitive theory is stated and supported by examples; a rival is set out that fits the same examples; a later finding decides between them; the rival is preferred", "An intuitive theory is stated and undone by counter-examples; a rival is set out and supported; a later finding complicates it; the rival is kept, its predictive reach qualified", "Two theories are set out side by side; counter-examples undo the first; an island study confirms the second; a stream study shows its prediction to have been false"]}, {"stem": "Which of the following can be most reasonably inferred from the fourth paragraph?", "o": ["Guppies in streams with few predators may have aged sooner partly because their denser, unthinned populations left them less well fed", "Guppies from streams crowded with predators probably live longer, on average, than guppies from streams in which predators are few", "Predators in the dangerous streams were found to take mainly the slow and the weak, which is why the fish there aged later", "The guppy results suggest that the level of external danger may have little bearing on how a population's ageing evolves"]}, {"stem": "The author notes that the island opossums were found 'to age more slowly by physiological measures, not merely to die later' primarily in order to:", "o": ["show that the theory's prediction holds for animals that cannot fly, and not only for the birds and bats already mentioned", "show that the opossums met the theory's real prediction, which concerns how fast bodies decline, not merely how long animals survive", "explain why, as the last paragraph goes on to say, the opossum result came to confirm less than had once been supposed", "establish that slower ageing, rather than freedom from predators, is why island animals outlive their relatives on the mainland"]}, {"stem": "Read the following line from the passage: 'it does mean that the island opossums confirmed less than was once supposed, and the guppies refuted less.' Which of the following can be most reasonably inferred from the quoted line?", "o": ["The opossums supported the theory less than the guppies undermined it, so that the balance of evidence now runs against the theory", "The two findings cancel each other out, leaving the evolutionary account of ageing exactly where it had stood before either of the two studies", "Since the theory predicts only once a population's pattern of deaths is known, a fit and a misfit both say less than they seemed to", "The opossum study was carried out less carefully than the guppy study, and so its result deserves rather less weight in judging the theory"]}]}, {"id": "p4", "label": "Passage IV", "kind": "Philosophy: is gratitude a debt?", "text": ["We speak of gratitude in the language of the counting-house. A favour puts us 'in someone's debt'; we 'owe' them thanks; a kindness returned leaves us 'quits'. The metaphor is so familiar that it is easy to forget that it is one, and easier still to let it settle questions it was never fit to settle.", "Consider how a debt behaves. It is created by a transfer, whatever the creditor's motive: the moneylender who lends at ruinous interest is owed his principal as surely as the friend who lends at none. It can be discharged by an equivalent return, after which nothing remains between the parties. And it can be passed on: a creditor may sell what he is owed to a stranger, who then has every right to collect it. Gratitude does none of these things. A benefit conferred in order to secure a vote or a contract creates, at most, an obligation of politeness; whatever else the beneficiary owes, it is not gratitude, for gratitude answers not to the benefit but to the goodwill behind it. Nor can gratitude be sold. If my neighbour, who sat with my mother through her last illness, were to make over to his cousin whatever I owe him for it, the cousin would acquire nothing; my gratitude cannot follow the paper.", "Most tellingly, gratitude is not extinguished by repayment. The guest who, the morning after a dinner, sends round a gift of precisely the dinner's cost has not discharged a debt so much as declined a relationship. Seneca saw this two thousand years ago: a man too eager to repay, he remarked, is an unwilling debtor, and an unwilling debtor is ungrateful. That Seneca made the point in the very vocabulary it undermines is a measure of how firmly the metaphor holds.", "It may be objected that if gratitude is not a debt, it is not owed at all, and becomes a feeling that one either happens to have or does not. That would be too quick. What gratitude requires is not a return but a recognition: an acknowledgement, in attention and in attitude, that another person has acted for one's good out of regard for it. Recognition can be owed as respect is owed, without being payable, and it can be withheld culpably, as when a man treats a sacrifice made for him as though it were the weather. The price of this account must be admitted. An obligation that cannot be measured cannot be enforced, and since recognition lives largely in attitudes that others cannot inspect, no one can be sure from outside whether it has been given. Those who like their duties to come with receipts will find this unsatisfying.", "Yet the debt metaphor endures, and it would be careless to suppose that it endures by mistake. Being benefited is uncomfortable. It places us, for a time, beneath the person who has helped us, and the impulse to repay is in part an impulse to restore the level. The metaphor gives that impulse a respectable name, and in doing so disguises it. That is why the person most scrupulous about returning favours is not always the most grateful, and why the ingrate, on this view, is less often the one who forgets a kindness than the one who cannot rest until it has been cancelled."], "qs": [{"stem": "Which of the following best captures the central idea of the passage?", "o": ["Gratitude is a feeling that cannot be owed, since an obligation that cannot be measured cannot be enforced by anyone", "The language of debt misdescribes gratitude and, being a mere slip of idiom, ought to give way to the language of respect", "Repaying a kindness promptly is a sign of ingratitude, as Seneca observed, and so favours are best left unreturned", "Gratitude asks for recognition of goodwill, not repayment; the debt idea endures because it gives the urge to be quits a respectable name"]}, {"stem": "Consider the phrase 'as when a man treats a sacrifice made for him as though it were the weather'. Which of the following best describes the device used and what it conveys?", "o": ["A metaphor, presenting the sacrifice as something that comes and goes and is soon forgotten, as the weather does", "A simile, presenting a deliberate act of goodwill as something that merely befalls him and is owed to no one", "A simile, presenting the sacrifice as something that comes and goes and is soon forgotten, as the weather does", "A metaphor, presenting a deliberate act of goodwill as something that merely befalls him and is owed to no one"]}, {"stem": "Which of the following best describes the author's response to the objection that gratitude, if it is not a debt, is not owed at all?", "o": ["The author rejects it as hasty: recognition can be owed though not payable, even if outsiders cannot check whether it is given", "The author accepts it, concluding that gratitude is merely a feeling, though one for which a person may still rightly be blamed", "The author rejects it on the ground that recognition, like respect, can be measured by the attention a person pays to a benefactor", "The author rejects it as hasty: recognition can be owed though not payable, and those who see it withheld can enforce it by disapproval"]}, {"stem": "Which of the following is the author most likely to agree with?", "o": ["A beneficiary who at once returns a favour of exactly equal value has shown the fullest gratitude that anyone can show", "Since recognition cannot be inspected from outside, no one can rightly be blamed for failing to be grateful to another", "The debt metaphor survives largely because people have not noticed that it is a metaphor rather than a literal truth", "A rival who saves a firm only to keep a competitor out of its market is owed no gratitude"]}, {"stem": "Read this line from the passage: 'the ingrate, on this view, is less often the one who forgets a kindness than the one who cannot rest until it has been cancelled.' Which of the following captures its meaning best?", "o": ["Ingratitude shows itself less in forgetting a kindness than in refusing to acknowledge it once one has paid it back", "Those who forget a kindness are seldom ungrateful, since forgetting involves no wish to be free of the person who showed it", "Ingratitude more often takes the form of an urge to settle the account, and so escape being beholden, than of forgetting", "Those most eager to return a favour are, for that very reason, the least grateful of all who receive one"]}, {"stem": "The author would accept each of the following EXCEPT:", "o": ["A debt can be owed to a person who acted from wholly self-interested motives when the debt was created", "Seneca's remark shows that he, at least, had freed his thinking from the vocabulary of debt", "A person can fail in gratitude without having failed to repay anything that he was given", "The wish to repay a kindness may be partly a wish to stop being beneath the one who showed it"]}]}]};

const P=DATA.passages, CODES=DATA.codes, QS=[];
P.forEach((p,pi)=>p.qs.forEach(q=>{ q.n=QS.length+1; q.pi=pi; QS.push(q); }));
const LIMIT=30*60*1000, L="abcd", TOTAL=QS.length, LSKEY="rcstepup-s1-current";
let REV=null;
function unseal(){ if(REV) return REV; const b=atob(SEAL), k="rc-step-up-sectional-1", out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i)^((k.charCodeAt(i%k.length)+i*7)%256);
  REV=JSON.parse(new TextDecoder().decode(out)); return REV; }

/* ------------------------------------------------------------------ STATE */
let S=null, db=null, view="start", past=[], saveTimer=null, tickTimer=null, lastTick=0, saveMsg="";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function newAttempt(){ return {id:"att-"+Date.now().toString(36), startedAt:Date.now(), status:"in_progress", answers:{}, flags:{}, passageMs:{}, changes:{}, firstAt:{}, cur:0}; }
function elapsed(st=S){ return st ? Math.min(LIMIT,(st.submittedAt||Date.now())-st.startedAt) : 0; }

function score(st){
  const R=unseal(); let r=0,w=0,u=0; const traps={}, per=[];
  QS.forEach(q=>{ const a=st.answers[q.n], k=R.key[q.n-1]; let t=null;
    if(!a) u++; else if(a===k) r++; else { w++; t=R.traps[q.n-1][a]; if(t) traps[t]=(traps[t]||0)+1; }
    per.push({n:q.n,picked:a||null,correct:k,trap:t}); });
  return {r,w,u,net:r-0.25*w,traps,per};
}

/* ------------------------------------------------------------------ PERSISTENCE */
function persistSoon(){ ls.set(LSKEY,S); clearTimeout(saveTimer); saveTimer=setTimeout(persistNow,1500); }
async function persistNow(){
  if(S&&S.status==="in_progress") ls.set(LSKEY,S);
  if(!db||!S) return;
  try{
    const body=JSON.parse(JSON.stringify(S));
    if(S.status==="submitted"){ const sc=score(S); body.result={right:sc.r,wrong:sc.w,unanswered:sc.u,net:sc.net,traps:sc.traps,perQuestion:sc.per,timeMs:elapsed()}; }
    await db.collection("attempts").doc(S.id).set(body);
    saveMsg="Saved"; paintSaved();
  }catch(e){ saveMsg= e&&e.code==="quota_exceeded" ? "Storage full: kept in this browser only" : "Saved in this browser"; paintSaved(); }
}
function paintSaved(){ const el=document.getElementById("saved"); if(el) el.textContent=saveMsg; }
async function loadPast(){
  if(!db) return;
  try{ const snap=await db.collection("attempts").orderBy("startedAt","desc").limit(20).get();
    past=snap.docs.map(d=>d.data()).filter(Boolean); if(view==="start") render(); }catch(e){}
}

/* ------------------------------------------------------------------ RENDER */
function render(){ if(view==="start") return renderStart(); if(view==="test") return renderTest(); if(view==="result") return renderResult(); }

function renderStart(){
  const local=ls.get(LSKEY);
  const resume=(local&&local.status==="in_progress")?local:(past.find(a=>a.status==="in_progress")||null);
  const done=past.filter(a=>a.status==="submitted"&&a.result);
  const left=resume?LIMIT-(Date.now()-resume.startedAt):0;
  app.innerHTML=`<div class="gut"><div class="wrap"><div class="intro">
    <div class="stack">
      <p class="eyebrow">RC series · Step-Up Sectional · one step above CL mocks</p>
      <h1>RC Step-Up Sectional</h1>
      <p style="font:17px/1.6 var(--f-read);max-width:62ch">Four original passages and 24 questions in the question types CLAT has set from 2022 to 2026: theme, literary device, word and phrase in context, what a detail suggests, tone, central idea, detail-why, inference, NOT supported, application, organisation, function of a detail, the author's response to a view, agree, meaning of a line and EXCEPT. One passage is fiction with a narrator who cannot see his own irony. Wrong options are built on the traps in your CL mock misses, every option in a question is about the same length, and the four letters are used six times each.</p>
      <div class="facts">
        <div class="fact"><b>24</b><span>4 passages × 6</span></div>
        <div class="fact"><b>30:00</b><span>hard limit; submits itself at zero</span></div>
        <div class="fact"><b>+1 / −0.25</b><span>blank scores 0</span></div>
      </div>
      <div class="plist">${P.map((p,i)=>`<b>P${i+1}</b><span>${esc(p.kind)}</span>`).join("")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${resume&&left>0?`<button class="btn primary" id="resume">Resume (${fmt(left)} left)</button><button class="btn" id="fresh">Start a fresh attempt</button>`:`<button class="btn primary" id="start">Start the clock</button>`}
      </div>
    </div>
    <div class="sheet">
      <h3>Before you start</h3>
      <ol class="rules">
        <li>The clock runs for 30 minutes and submits your answers when it reaches zero. A reload does not stop it.</li>
        <li>Answers and flags save as you go, so a reload or a dropped connection won't lose them.</li>
        <li>Submit asks you to confirm. Answers, explanations and trap codes appear only after that.</li>
        <li>Each wrong answer is tagged with the trap it fell for, using the codes from your CL mock error log.</li>
      </ol>
      ${done.length?`<div class="past"><p class="eyebrow">Previous attempts</p>${done.slice(0,5).map(a=>`<div><span>${new Date(a.startedAt).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span><span>${Number(a.result.net).toFixed(2)} / ${TOTAL} · ${a.result.right} right · ${a.result.wrong} wrong · ${fmt(a.result.timeMs)}</span></div>`).join("")}</div>`:""}
    </div>
  </div></div></div>`;
  const go=st=>{ S=st; view="test"; render(); persistNow(); startTick(); window.scrollTo({top:0}); };
  document.getElementById("start")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("fresh")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("resume")?.addEventListener("click",()=>go(resume));
}

const answeredIn=pi=>P[pi].qs.filter(q=>S.answers[q.n]).length;
const flaggedIn=pi=>P[pi].qs.filter(q=>S.flags[q.n]).length;

function renderTest(){
  const p=P[S.cur], answered=Object.keys(S.answers).length;
  app.innerHTML=`<div class="bar"><div class="bar-in gut">
      <span class="clock" id="clock" role="timer" aria-label="Time left">30:00</span>
      <span class="count" id="count">${answered}/${TOTAL} answered</span>
      <nav class="tabs" aria-label="Passages">${P.map((x,i)=>`<button class="tab" data-p="${i}" aria-current="${i===S.cur}">P${i+1}<span class="n">${answeredIn(i)}/${x.qs.length}</span>${flaggedIn(i)?`<span class="fl" title="flagged">⚑${flaggedIn(i)}</span>`:""}</button>`).join("")}</nav>
      <span class="spacer"></span><span class="saved" id="saved">${esc(saveMsg)}</span>
      <button class="btn danger" id="submit">Submit</button>
    </div></div>
    <div class="gut"><div class="wrap" style="padding-top:0">
      <div id="confirmBox"></div>
      <div class="test">
        <article class="passage" aria-label="${esc(p.label)}">
          <div class="head"><p class="eyebrow">${esc(p.kind)}</p><h2>${esc(p.label)}</h2></div>
          <div class="body">${p.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
        </article>
        <section class="qs" aria-label="Questions">${p.qs.map(qCard).join("")}
          <div class="navrow">${S.cur>0?`<button class="btn" id="prev">← Passage ${S.cur}</button>`:"<span></span>"}${S.cur<P.length-1?`<button class="btn primary" id="next">Passage ${S.cur+2} →</button>`:`<button class="btn danger" id="submit2">Submit</button>`}</div>
        </section>
      </div>
    </div></div>`;
  app.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchP(+b.dataset.p)));
  document.getElementById("prev")?.addEventListener("click",()=>switchP(S.cur-1));
  document.getElementById("next")?.addEventListener("click",()=>switchP(S.cur+1));
  ["submit","submit2"].forEach(id=>document.getElementById(id)?.addEventListener("click",askSubmit));
  app.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>pick(+r.dataset.q,r.value)));
  app.querySelectorAll(".flag").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; S.flags[n]=!S.flags[n]; persistSoon(); renderTest(); }));
  app.querySelectorAll(".clear").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; delete S.answers[n]; persistSoon(); renderTest(); }));
  tickClock();
}

function stemHTML(q){
  const st=q.stmts?`<div class="stmts">${q.stmts.map((t,i)=>`<div><b>${esc(q.stmtLabels[i])}</b><span>${esc(t)}</span></div>`).join("")}</div>`:"";
  return (q.quote?`<p class="stem">${esc(q.stem)}</p><div class="quote">${esc(q.quote)}</div>${q.after?`<p class="stem">${esc(q.after)}</p>`:""}`:`<p class="stem">${esc(q.stem)}</p>`)+st;
}
function qCard(q){
  const a=S.answers[q.n];
  return `<div class="q" id="q${q.n}">
    <div class="top"><span class="qn">Q${q.n}</span><button class="flag" data-q="${q.n}" aria-pressed="${!!S.flags[q.n]}">${S.flags[q.n]?"⚑ Flagged":"⚐ Flag"}</button></div>
    ${stemHTML(q)}
    <div class="opts" role="radiogroup" aria-label="Question ${q.n}">${q.o.map((t,i)=>{const l=L[i];return `<label class="opt${a===l?" sel":""}"><input type="radio" id="q${q.n}${l}" name="q${q.n}" value="${l}" data-q="${q.n}"${a===l?" checked":""}><span class="L">${l}</span><span>${esc(t)}</span></label>`}).join("")}</div>
    ${a?`<button class="clear" data-q="${q.n}">Clear answer</button>`:""}
  </div>`;
}
function pick(n,l){
  if(!S||S.status!=="in_progress") return;
  if(S.answers[n]&&S.answers[n]!==l) S.changes[n]=(S.changes[n]||0)+1;
  if(!S.firstAt[n]) S.firstAt[n]=Date.now()-S.startedAt;
  S.answers[n]=l;
  const card=document.getElementById("q"+n);
  if(card){ card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").value===l));
    if(!card.querySelector(".clear")){ const b=document.createElement("button"); b.className="clear"; b.dataset.q=n; b.textContent="Clear answer"; b.addEventListener("click",()=>{ delete S.answers[n]; persistSoon(); renderTest(); }); card.appendChild(b);} }
  const cnt=document.getElementById("count"); if(cnt) cnt.textContent=Object.keys(S.answers).length+"/"+TOTAL+" answered";
  app.querySelectorAll(".tab").forEach((b,i)=>{ const s=b.querySelector(".n"); if(s) s.textContent=answeredIn(i)+"/"+P[i].qs.length; });
  persistSoon();
}
function switchP(i){ accrue(); S.cur=i; persistSoon(); renderTest(); window.scrollTo({top:0}); }
function accrue(){ const now=Date.now(); if(lastTick&&view==="test"&&S&&!document.hidden){ const k=P[S.cur].id; S.passageMs[k]=(S.passageMs[k]||0)+(now-lastTick);} lastTick=now; }
function startTick(){ clearInterval(tickTimer); lastTick=Date.now(); tickTimer=setInterval(()=>{ accrue(); tickClock(); },1000); }
function tickClock(){
  if(!S||view!=="test") return;
  const left=LIMIT-(Date.now()-S.startedAt);
  if(left<=0){ submit(true); return; }
  const el=document.getElementById("clock"); if(!el) return;
  el.textContent=fmt(left); el.classList.toggle("low",left<5*60*1000);
}
function askSubmit(){
  const un=TOTAL-Object.keys(S.answers).length, fl=Object.values(S.flags).filter(Boolean).length;
  const box=document.getElementById("confirmBox");
  box.innerHTML=`<div class="confirm" role="alertdialog" aria-label="Confirm submission"><p><b>Submit now?</b> ${un} unanswered${fl?`, ${fl} flagged`:""}. You can't change answers after this.</p><span class="spacer"></span><button class="btn" id="keep">Keep working</button><button class="btn danger" id="really">Submit and see results</button></div>`;
  box.scrollIntoView({block:"nearest"});
  document.getElementById("keep").addEventListener("click",()=>box.innerHTML="");
  document.getElementById("really").addEventListener("click",()=>submit(false));
}
function submit(auto){
  if(!S||S.status!=="in_progress") return;
  accrue(); clearInterval(tickTimer);
  S.status="submitted"; S.auto=!!auto; S.submittedAt=auto?Math.min(Date.now(),S.startedAt+LIMIT):Date.now();
  ls.del(LSKEY); view="result"; persistNow(); render(); window.scrollTo({top:0}); loadPast();
}

function renderResult(){
  const R=unseal(), sc=score(S), t=elapsed();
  const trapRows=Object.entries(sc.traps).sort((a,b)=>b[1]-a[1]); const maxT=Math.max(1,...trapRows.map(x=>x[1]));
  const pRows=P.map(p=>{ const qs=p.qs; const r=qs.filter(q=>S.answers[q.n]===R.key[q.n-1]).length, w=qs.filter(q=>S.answers[q.n]&&S.answers[q.n]!==R.key[q.n-1]).length;
    return `<tr><td>${esc(p.label)} · ${esc(p.kind)}</td><td class="n">${r}</td><td class="n">${w}</td><td class="n">${qs.length-r-w}</td><td class="n">${fmt(S.passageMs[p.id]||0)}</td></tr>`; }).join("");
  app.innerHTML=`<div class="gut"><div class="wrap stack">
    <div class="stack" style="gap:8px"><p class="eyebrow">Result · ${new Date(S.startedAt).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p>
      <h1>${sc.net.toFixed(2)} out of ${TOTAL}</h1>
      <p class="muted">Time taken ${fmt(t)} of 30:00${S.auto?" · submitted automatically when time ran out":""}</p></div>
    <div class="scorehead">
      <div class="stat"><b>${sc.r}</b><span>right (+${sc.r})</span></div>
      <div class="stat"><b>${sc.w}</b><span>wrong (−${(0.25*sc.w).toFixed(2)})</span></div>
      <div class="stat"><b>${sc.u}</b><span>blank (0)</span></div>
      <div class="stat"><b>${sc.r+sc.w?Math.round(100*sc.r/(sc.r+sc.w)):0}%</b><span>accuracy on attempted</span></div>
    </div>
    <div class="intro" style="padding-top:0">
      <div class="sheet"><h3>Traps you fell for</h3>
        ${trapRows.length?`<div class="traps">${trapRows.map(([c,n])=>`<div class="trap"><span class="code">${c}</span><div><div style="font-weight:500">${esc(CODES[c][0])}</div><div class="muted" style="font-size:13px">${esc(CODES[c][1])}</div><div class="tbar" style="width:${Math.max(8,100*n/maxT)}%;margin-top:4px"></div></div><b style="font-family:var(--f-mono)">${n}</b></div>`).join("")}</div>`:`<p>No traps sprung. Every answer you gave was right.</p>`}
        <p class="muted" style="font-size:13px">Send me your time and the questions you got wrong or skipped, with what you marked, and I'll aim the next RC sectional at the pattern.</p>
      </div>
      <div class="ptable"><table><thead><tr><th>Passage</th><th style="text-align:right">Right</th><th style="text-align:right">Wrong</th><th style="text-align:right">Blank</th><th style="text-align:right">Time</th></tr></thead><tbody>${pRows}</tbody></table></div>
    </div>
    <div class="stack" style="gap:10px"><h2>Every question, marked</h2>
      <div class="review">${P.map(p=>`<details class="pz"><summary>${esc(p.label)}: re-read the passage</summary><div style="font:15px/1.65 var(--f-read);display:flex;flex-direction:column;gap:8px;padding:8px 2px">${p.text.map(x=>`<p>${esc(x)}</p>`).join("")}</div></details>`+p.qs.map(q=>rCard(q,R)).join("")).join("")}</div>
    </div>
    <div><button class="btn" id="home">Back to start</button></div>
  </div></div>`;
  document.getElementById("home").addEventListener("click",()=>{ view="start"; S=null; render(); loadPast(); });
}
function rCard(q,R){
  const i=q.n-1, a=S.answers[q.n], k=R.key[i], st=!a?"u":a===k?"r":"w", tr=R.traps[i], code=st==="w"?tr[a]:null;
  return `<div class="rq ${st}">
    <div class="rtop"><span class="qn">Q${q.n} · ${esc(P[q.pi].label)} · ${esc(R.type[i])}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${st==="r"?`<span class="pill r">Right</span>`:st==="u"?`<span class="pill u">Blank · answer ${k}</span>`:`<span class="pill w">You: ${a} · answer ${k} · Trap ${code}: ${esc(CODES[code][0])}</span>`}${S.changes[q.n]?`<span class="pill">changed ${S.changes[q.n]}×</span>`:""}</span></div>
    ${stemHTML(q)}
    <div class="opts">${q.o.map((t,j)=>{const l=L[j];const cls=l===k?"ans":(l===a?"bad":"");const tag=l===k?`<span class="pill r">key</span>`:`<span class="pill">${tr[l]}</span>`;return `<div class="ro ${cls}"><b>${l}</b><span>${esc(t)}</span>${tag}</div>`}).join("")}</div>
    <div class="why"><p>${esc(R.why[i])}</p>
      <details class="ex"${st==="w"?" open":""}><summary>Why each option is right or wrong</summary><ul>${L.split("").map(l=>`<li><b>${l}${l===k?" (key)":" · "+tr[l]}</b>: ${esc(R.reasons[i][l])}</li>`).join("")}</ul></details>
      <p class="muted" style="font-size:13px">Modelled on: ${esc(R.src[i])}</p></div>
  </div>`;
}

/* ------------------------------------------------------------------ BOOT */
document.addEventListener("visibilitychange",()=>{ if(view==="test"){ accrue(); if(document.hidden) persistNow(); }});
function start(data){
  if(data&&data.S){ S=data.S; view=data.view||"start"; }
  else { const local=ls.get(LSKEY);
    if(local&&local.status==="in_progress"&&Date.now()-local.startedAt>=LIMIT){ S=local; view="test"; submit(true); } }
  render();
  if(view==="test") startTick();
  (async()=>{ try{ db=window.claude?await window.claude.use("db"):null; }catch(e){ db=null; }
    if(db){ await loadPast();
      if(view==="start"){ const open=past.find(a=>a.status==="in_progress"&&!ls.get(LSKEY));
        if(open&&Date.now()-open.startedAt>=LIMIT){ S=open; view="test"; submit(true); } }
      else if(S) persistNow(); } })();
}
window.claude?.hot?.snapshot?.(()=>({S,view}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
