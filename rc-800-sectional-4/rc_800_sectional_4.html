<style>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 clamp(28px,4.4vw,40px)/1.15 var(--f-read)}
h2{font:600 22px/1.25 var(--f-read)}
h3{font:600 15px/1.35 var(--f-ui)}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--wrong);color:var(--paper);border-color:var(--wrong)}
.stack{display:flex;flex-direction:column;gap:20px}
/* start */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:18px}
.intro > *{min-width:0}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.fact b{display:block;font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.plist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.plist b{font:500 12px/1.9 var(--f-mono);color:var(--muted)}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.past{display:flex;flex-direction:column;gap:6px;font-size:14px}
.past div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:6px;font-variant-numeric:tabular-nums}

.bar-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.clock{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:76px}

.count{font:500 13px var(--f-mono);color:var(--muted)}
.spacer{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 11px;font:500 12px/1.5 var(--f-mono);cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.flag{border:0;background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer;padding:2px 4px}
.flag[aria-pressed="true"]{color:var(--skip)}
.clear{border:0;background:none;color:var(--muted);font:12px var(--f-ui);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.confirm{background:var(--skip-soft);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
/* results */
.scorehead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:500 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.traps{display:flex;flex-direction:column;gap:8px}
.trap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.code{font:600 13px var(--f-mono);width:30px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--wrong-soft);color:var(--wrong)}
.tbar{height:8px;border-radius:4px;background:var(--wrong);opacity:.85}
.review{display:flex;flex-direction:column;gap:12px}
.rq{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rq.r{border-left-color:var(--right)} .rq.w{border-left-color:var(--wrong)} .rq.u{border-left-color:var(--skip)}
.rtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ro{font-size:14px;padding:6px 8px;border-radius:6px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:start}
.ro.ans{background:var(--right-soft)} .ro.bad{background:var(--wrong-soft)}
.ro b{font-family:var(--f-mono)}
.pill{font:500 11px/1.5 var(--f-mono);padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;align-self:start}
.pill.w{background:var(--wrong-soft);color:var(--wrong)} .pill.r{background:var(--right-soft);color:var(--right)} .pill.u{background:var(--skip-soft);color:var(--skip)}
.why{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details.pz summary,details.ex summary{cursor:pointer;color:var(--muted);font-size:13px}
.ptable{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--rule);text-align:left}
th{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.banner{background:var(--skip-soft);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14px}
@media (max-width:860px){

  .scorehead{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){ .opt{transition:background .12s,border-color .12s} }

const DATA={"codes": {"X": ["Absolute word", "The option needs 'every / only / always / never / prove', and the passage never earns it."], "P": ["Part, not the whole", "True of one paragraph, one factor or one event; leaves out what the passage keeps returning to."], "B": ["Too broad", "Turns a claim about this case into a claim about everything of its kind."], "W": ["Wrong weighting", "Ranks two things the passage never ranks, or gives a side point the weight of the thesis."], "A": ["Added idea", "Brings in a cause, motive, effect or comparison the passage never gives."], "N": ["Supported, not the needed link", "True or plausible, but not the premise, evidence or discriminating fact the question asks for (or far too weak to matter)."], "R": ["Someone else's view or an echo", "A view the author reports or rejects, or the passage's own words with the meaning shifted."], "L": ["Mixes up two things", "Contradicts a stated line, swaps two things the passage keeps apart, or reverses a direction."], "E": ["NOT / EXCEPT reversal", "On a NOT, EXCEPT or 'would NOT support' question, this one fits the passage (or is answered by it), so it can't be the answer."], "O": ["Half-right tone", "One word or the explanation fits; the other half doesn't. Includes 'detached… without passing judgment' for a passage that judges."], "F": ["Word, term or figure misread", "The dictionary sense instead of the one the context forces, or the wrong figure of speech."], "G": ["Grammar rule", "Comma splice, faulty 'and + -ing', or 'so as to' turning a result into a purpose."], "T": ["Wrong target", "Bears on a different claim from the one the question asks about."], "M": ["Mechanism mismatch", "Looks like the passage's case, but the reason it works is different."]}, "passages": [{"id": "p1", "label": "Passage 1", "kind": "Philosophy · the ethics of promising", "text": ["Asha promises herself that she will finish restoring her father's fishing boat before the monsoon. In August, with the hull half-caulked, she stops. Has she broken a promise, or merely changed her mind? The sceptic answers that nothing more than a change of mind was ever possible. Hobbes put the point with characteristic economy while explaining why a sovereign cannot be bound by his own laws: he that can bind can release, and therefore he that is bound to himself only is not bound. If the person who holds a promise is the person who owes it, the power to cancel the obligation lies with the very party it was meant to constrain, and an obligation that the obligor may cancel at pleasure constrains nothing. A promise to oneself, on this view, is a resolution in borrowed clothes: a statement of present intention, dignified by a vocabulary that implies a creditor where there is none.", "The argument is tidier than it looks, because it passes silently from the identity of persons to the identity of standpoints. Even between two people, not every utterance of 'I release you' releases. A release given because the promisee has been worn down, or deceived about what the promise protected, is defective, and the defect lies not in who speaks the words but in whether they are spoken from the position the promise was meant to secure, that of the party whose interest it serves. Within a single life those positions can come apart. Asha in August is both the one burdened by the promise and the one for whose sake it was made, and whether she has been released is not settled by noting that both roles are hers. It is settled by asking in which role she decided. 'I would rather not' is the voice of the promisor; 'the boat is no longer worth saving' may be the voice of the promisee. Only the second releases.", "An objection presses at once. If both roles are mine, nothing prevents me from dressing the promisor's reluctance in the promisee's language, and since no one else can inspect the costume, the distinction does no work. But the objection proves too much. Releases between persons are seldom inspected either; we accept a friend's 'never mind' without inquiring into its sincerity, and the difference between a free release and an extracted one is not thereby made idle. The distinction's proper home is not the tribunal but deliberation. Someone who asks whether the purpose of a promise still holds is asking a different question from someone who asks whether she still feels like keeping it, and she can usually tell which question she is asking, even when she would prefer not to know.", "This defence has a price, and it should be paid openly. If self-promises bind only those able to occupy the promisee's standpoint against the pull of present inclination, they bind most reliably the people who least need binding. The procrastinator who promises himself to begin his thesis on Monday is precisely the person in whom the promisee's voice is likely to be faint, and for him the distinction I have drawn describes what he lacks rather than supplying what he needs. Self-promising, so understood, is less a technique for overcoming weakness than a practice whose success presupposes a strength already there.", "Harder to settle is what, if anything, the defaulter has done wrong. When I break a promise to you, I wrong you; there is a claimant whose grievance does not depend on my feelings about it. When Asha abandons the boat for reasons that are hers only as promisor, there is no second party whose complaint survives her indifference. One may say that she has damaged her capacity to rely on her own word, so that her later promises to herself will carry less weight. That is true, but it makes the obligation's force derivative of its usefulness, which is the very reduction the sceptic offered at the start. The distinction between deciding as promisor and deciding as promisee survives the objection; whether what it distinguishes still deserves the name of a promise is another matter."], "qs": [{"stem": "Which of the following best captures the central idea of the passage?", "o": ["Since only those able to take the promisee's standpoint against inclination are bound by self-promises, such promises bind best the people who least need binding.", "Because whoever holds a promise to himself can cancel it at pleasure, such a promise is only a resolution, though it may still be useful to make one.", "The sceptic's case against self-promising confuses persons with standpoints, but correcting it exposes a further question about what wrong a defaulter commits.", "Whether a release from an obligation counts depends on the standpoint from which it is given, though in practice no outsider can tell which standpoint that was."]}, {"stem": "Which of the following, if true, would most seriously weaken the author's claim in the third paragraph that a person 'can usually tell which question she is asking'?", "o": ["Diaries kept as people abandon self-promises show them weighing only their current wishes, yet at that moment most say they are weighing the promise's purpose.", "No one other than the person herself is ever in a position to check whether a release she grants herself was granted as promisee rather than merely as promisor.", "People break a larger share of the promises they make to themselves than of those they make to friends, though they say they feel worse about breaking the latter.", "People who keep their promises to themselves usually do so out of habit, without first stopping to ask whether the promise's purpose still holds."]}, {"stem": "The author's argument in the second paragraph challenges which of the following assumptions on which the sceptic's argument relies?", "o": ["That a promise gives rise to a genuine claim only where some second party stands ready to complain whenever the promise is broken.", "That a release extracted from a promisee who has been worn down, or who was deceived about what the promise protected, is defective.", "That a promise to oneself differs from a resolution only in the dignified vocabulary in which the speaker chooses to express her intention.", "That a person who holds a promise releases it validly whenever she declares it released, in whatever capacity she happens to declare it."]}, {"stem": "As used in the first paragraph, the word 'creditor' (in 'a vocabulary that implies a creditor where there is none') most nearly means:", "o": ["a lender of money, because the sceptic's argument turns on who holds the power to cancel what is owed.", "a party owed the performance, because no second person exists to whom a self-promise could be kept.", "one who gives credence, because the sceptic calls a self-promise only 'a statement of present intention'.", "a guarantor of the promise, because Hobbes's sovereign can both bind and release himself whenever he likes."]}, {"stem": "Which of the following is most closely analogous to the distinction the author draws in the second paragraph?", "o": ["A committee may overrule its chair only by a majority vote of its members, so that the chair's own wishes cannot settle a disputed question.", "A shopkeeper who borrows from her own till must record the loan in a ledger, so that an auditor can later confirm that it was repaid.", "A runner who has promised his coach to train every day can be released by the coach, but not by deciding for himself that he has trained enough.", "A referee who is also playing in a friendly match may award a penalty only by judging as a referee would, not because it would help his own side."]}, {"stem": "Which of the following situations, if true, would NOT support the reasoning in the fourth paragraph that self-promises bind most reliably those who least need binding, because only they can hold to the promisee's standpoint against inclination?", "o": ["Disciplined people keep more of their promises to themselves than procrastinators do, but only because the promises they make are smaller and easier to keep.", "Procrastinators reminded of a promise's purpose at the moment of temptation break it about as often as those who are not reminded at all.", "A procrastinator's promises to himself grow more reliable only after he has learned, by quite other means, to resist the pull of the moment.", "Those who most often break their promises to themselves are least able to put a promise's purpose above their feelings, though they make no more such promises."]}]}, {"id": "p2", "label": "Passage 2", "kind": "Science · microbiology", "text": ["In 1944 Joseph Bigger, an Irish bacteriologist, recorded an awkward fact about penicillin. The drug killed cultures of staphylococci rapidly but never completely: a tiny residue, rarely more than one cell in a million, survived exposures that should have sterilised the flask. The residue was not resistant. When Bigger grew the survivors up and exposed their descendants to the drug, the new culture died as the original had, down to a similarly small remainder, so whatever had protected the survivors had not been inherited. He called them persisters, a name that has outlived several attempts to explain them. Their signature is a biphasic killing curve: a steep initial decline as the bulk of the population dies, then a plateau in which a minority outlasts exposures many times longer. Resistance shifts the whole curve; persistence bends its tail.", "For decades the favoured explanation was dormancy. Most bactericidal antibiotics kill by corrupting a process the cell is actively running, such as building its wall, making proteins or copying its DNA, so a cell that has stopped running them offers the drug nothing to corrupt. The puzzle was why a few cells in a genetically uniform culture should stop. One answer invoked toxin–antitoxin modules, paired genes that encode a stable toxin able to arrest growth and an unstable antitoxin that neutralises it. Because the antitoxin is continually degraded and must be continually replaced, a chance dip in its supply could free the toxin and shut a cell down, making dormancy the output of a regulated, if randomly triggered, programme. A much-cited series of experiments appeared to show that deleting such modules sharply reduced persistence. Two of its central papers were later retracted, after the laboratory itself discovered that its engineered strains had picked up a bacteriophage, a virus that infects bacteria, whose presence could account for the difference.", "The retractions did not refute dormancy, but they removed the strongest evidence for a dedicated switch, and a rival account has since gained ground. On this view there is no programme at all: persisters are cells that, through ordinary fluctuations in metabolism, happen to be low on ATP, the molecule that powers most of the processes antibiotics attack. Persistence becomes a by-product of noise rather than a product of design. The two accounts are harder to separate than they sound, since both predict that survivors will be metabolically quiet; they differ over whether the quiet is regulated. And the obvious experiment, measuring energy levels in a culture exposed to a drug, is close to useless when persisters may number one cell in ten thousand or fewer: a shift in the culture's average could reflect a small change in every cell or a large change in a handful, and only the second bears on persistence.", "The way forward has been to follow single cells. In 2004 Nathalie Balaban and her colleagues watched individual Escherichia coli in microfluidic channels before, during and after exposure to ampicillin, a relative of penicillin, and found that the survivors had been growing slowly or not at all before the drug arrived. It was a striking confirmation of pre-existing dormancy, though obtained in mutant strains that form persisters at many times the ordinary rate. Nine years later, a study of mycobacteria treated with isoniazid found something different. The survivors had been growing and dividing much like their neighbours; what distinguished them was the fluctuating level of an enzyme the drug needs to become active, so that a cell caught with little of the enzyme converted less of the drug into its lethal form.", "These results are usually enlisted on one side or the other, but together they suggest something less tidy: that 'persistence' may name an outcome rather than a mechanism, so that cells survive a drug that attacks growth by not growing, and survive a drug that must be activated by failing to activate it. If so, the search for the switch was framed too narrowly. Yet that conclusion must be held loosely, for nearly all these observations were made in cultures growing fast in rich medium, where quiet cells are rare enough to stand out. In an abscess or a biofilm, where most cells grow slowly, the line between the persister and its neighbours may be far fainter, and a treatment designed to wake the persisters may find that it must wake almost everyone."], "qs": [{"stem": "What is the primary purpose of the passage?", "o": ["To show that the retraction of the toxin–antitoxin studies has seriously weakened the case for dormancy as the main explanation of persistence.", "To weigh the dormancy and energy accounts against each other and to conclude, with some reservations, that the energy account better explains the evidence.", "To trace how explanations of why some bacteria survive antibiotics have shifted, and to suggest, with a caveat, that such survival may arise by more than one route.", "To argue that laboratory studies of bacteria grown in rich medium may reveal little about infections, leaving the clinical value of persister research open."]}, {"stem": "Which of the following, if true, would most strengthen the account described in the third paragraph against the toxin–antitoxin account?", "o": ["In many bacterial species, the cells that survive an antibiotic turn out to have been metabolically quiet, rather than active, when the drug first arrived.", "Cells engineered so that none of their antitoxins can be degraded still form persisters at the usual rate, with survival going to those lowest in ATP.", "A culture's average ATP level falls in the minutes before its killing curve flattens, while its toxin–antitoxin activity stays the same throughout.", "Deleting the toxin–antitoxin modules from a strain that has been checked and found free of phage sharply reduces the rate at which it forms persisters."]}, {"stem": "Bigger's conclusion that the surviving cells were not resistant, as the first paragraph reports it, depends on which of the following assumptions?", "o": ["Had the survivors been resistant, their descendants would have inherited that resistance and survived the drug better.", "The surviving cells had already been dormant when the penicillin arrived, and so offered the drug nothing that it could corrupt.", "Penicillin kills a bacterium only while the cell is building its wall, so the dividing cells are the ones most exposed to the drug.", "Bigger had screened the original culture for resistant cells, and found none, before he first added any penicillin to it."]}, {"stem": "According to the passage, why did the retractions described in the second paragraph not refute the dormancy explanation of persistence?", "o": ["The bacteriophage that contaminated the engineered strains was itself later found to make cells dormant, so dormancy still explained the survival observed.", "The single-cell study had already confirmed pre-existing dormancy in strains that form persisters at the ordinary rate, so dormancy stood regardless of them.", "The retracted work concerned what might switch cells off, not whether survivors are quiet, and losing evidence for a switch is no case against dormancy.", "Every later study of persistence has confirmed that the survivors are dormant, so losing one line of evidence could not weaken that case."]}, {"stem": "The passage provides information to answer each of the following questions EXCEPT:", "o": ["How did Bigger establish that the cells surviving penicillin were not resistant to the drug?", "Why does a cell that has stopped growing escape being killed by most bactericidal antibiotics?", "What distinguished the mycobacteria that survived isoniazid from their neighbours that were killed?", "How did the phage's presence in the engineered strains account for the difference in persistence?"]}, {"stem": "Read the following line from the passage:", "quote": "\"Resistance shifts the whole curve; persistence bends its tail.\"", "after": "Which of the following can be most reasonably inferred from the quoted line?", "o": ["Since persistence affects only the tail, a culture rich in persisters loses the bulk of its cells more slowly at first than an ordinary culture does.", "If a culture's early decline is unchanged but a small remnant then outlasts far longer exposures, the pattern points to persistence, not resistance.", "Persisters can be recognised only after most of a culture has died, since they show up solely in the far tail of its killing curve.", "Cultures whose killing curves show the steepest initial decline are the ones most likely to contain a surviving minority of persister cells."]}]}, {"id": "p3", "label": "Passage 3", "kind": "Modern Indian history · the colonial economy", "text": ["Few indictments of British rule were pressed more persistently by early Indian nationalists than the charge against the railways. The lines, critics such as Romesh Chunder Dutt argued, had been laid to carry raw cotton to the ports and Lancashire cloth back from them; they had been built by British companies whose investors were promised a return of five per cent on their capital, paid out of Indian revenues whether or not the lines earned it; and they had absorbed sums that, spent on irrigation, would have done far more to protect the cultivator against drought. The railways, on this view, were less an investment in India than a charge levied on it.", "A century later the question was reopened with tools the nationalists did not possess. Using district-level data on prices, rainfall and output from the late nineteenth and early twentieth centuries, the economist Dave Donaldson estimated that the arrival of the railway lowered the cost of moving goods, narrowed the gaps between prices in different districts and raised real agricultural income in the districts it reached by roughly sixteen per cent. The obvious objection, that the lines had simply been laid where growth was coming anyway, he met ingeniously: more than forty thousand kilometres of line had been approved but, for one reason or another, never built, and the districts along those phantom routes showed no comparable gains. Related work found that, once a district was connected, a failure of its rains became much less likely to turn into famine.", "It is tempting to read these findings as a verdict against the nationalists, and they are often cited as one. But the two bodies of work answer different questions, because they measure the railways against different alternatives. Donaldson's comparison is with an India that had no railways; the nationalists' was with an India whose revenues had been spent otherwise, or whose railways had been built on other terms. A gain of sixteen per cent over no railway at all says nothing about whether canals, or lines laid to serve inland markets rather than the ports, would have yielded more. Nor does an average gain settle who received it: a district's real income can rise while the merchant who moves its grain gains much and the labourer who eats it gains little. The verdict and the indictment pass each other like trains on parallel tracks, each keeping to its own timetable and neither arriving at the other's station.", "The famine result is more uncomfortable for the older critique, since some critics had argued that the railways left the countryside more exposed to famine, not less. Here too the agreement is narrower than it looks. Integration protected a district against a local failure of the rains because grain could now flow in; it also meant that grain could flow out when prices elsewhere were higher, and critics at the time of the great famine of 1876 to 1878 alleged that it had done exactly that. Both effects are compatible with the econometric finding, which measures how far the link between rainfall and famine weakened on average, not whether particular districts in particular years were stripped of food by the very lines that were meant to feed them.", "None of this rescues the nationalist case in its original form, which held that the railways impoverished India outright; on that point the evidence has moved decisively against it. What survives is a different charge, and a harder one to test: that the terms on which the lines were financed turned a public gain into a private claim on public money. Under the guarantee, Indian taxpayers bore the risk of lines whose returns flowed largely to investors in Britain. Whether that arrangement cost India more than the railways gave back depends on what the same capital would have cost on any other terms, and on that question the econometrics, for all their ingenuity, are silent."], "qs": [{"stem": "Which of the following best captures the central idea of the passage?", "o": ["Connecting a district to the railway made a failure of its rains much less likely to become famine, since grain could then be brought in from elsewhere.", "Recent econometric work has refuted the nationalist critique of the railways, though the guarantee that financed them was admittedly a poor bargain for India.", "Quantitative history can settle a controversy only when its practitioners and their critics have first agreed on what the past is to be compared with.", "Estimates showing that the railways raised incomes answer a different question from the nationalists', and so settle less of the old debate than is commonly supposed."]}, {"stem": "Which of the following, if true, would most weaken the conclusion Donaldson drew from the lines that were approved but never built?", "o": ["Most approved lines that were never built had been dropped because surveys judged the districts they would serve poor and unpromising.", "Before any lines were planned, districts along the phantom routes had grown at much the same rate as the districts that the railway later reached.", "Nationalist critics complained that the lines were laid to carry raw cotton to the ports rather than to serve the districts they crossed.", "In connected districts, grain merchants' incomes rose quickly while the real wages of the labourers who worked the land barely moved."]}, {"stem": "Which of the following conclusions is best supported by the third and fourth paragraphs taken together?", "o": ["Unlike the income finding, the famine finding measures the railways against an India in which no district had yet been connected at all.", "The famine finding is more trustworthy than the income finding, since it rests on records of rainfall rather than on estimates of output.", "Both findings are averages, and neither rules out particular people or districts having lost out even as the average improved.", "Both findings show that the nationalist critics were wrong about the railways, though each of them shows it for a different reason."]}, {"stem": "Which of the following figures of speech is most prominently employed in the line below?", "quote": "\"The verdict and the indictment pass each other like trains on parallel tracks, each keeping to its own timetable and neither arriving at the other's station.\"", "o": ["Metaphor, because the verdict and the indictment are pictured as trains, an image the author carries on through 'timetable' and 'station'.", "Personification, because two bodies of scholarship are made to keep their own 'timetable' and miss each other's 'station', as if they had purposes.", "Simile, because the comparison of the two bodies of work with trains is made explicit with 'like' and then drawn out through 'timetable' and 'station'.", "Analogy, because the author argues from how railway timetables are drawn up to how historians ought to choose the comparisons they make."]}, {"stem": "The author sets out the nationalists' charges in the first paragraph in some detail primarily in order to", "o": ["show how much of the nationalist case depended on claims the critics had no means of testing with the data of their day.", "prepare for the later argument that the econometrics refute the claim of outright loss and leave the other charges open.", "present the nationalist view that the author then goes on to defend, against the econometric findings, in the rest of the passage.", "establish that the guarantee system, rather than the railways themselves, was the chief cause of the poverty of colonial India."]}, {"stem": "As used at the end of the first paragraph, the word 'charge' (in 'less an investment in India than a charge levied on it') most nearly means:", "o": ["a cost imposed, because the critics held that India paid for lines whose gains went largely to others.", "an accusation, because the paragraph opens with the 'charge against the railways' that the nationalists pressed.", "a judge's instruction to a jury, because the paragraph presents the nationalists' case as an indictment.", "a responsibility entrusted, because the lines were placed in the charge of the British companies that built them."]}]}, {"id": "p4", "label": "Passage 4", "kind": "Literary criticism · textual editing", "text": ["Between 1907 and 1909 Henry James reissued much of his fiction in a collected edition, and for several of the early novels he did not merely correct but rewrote, sentence by sentence, in the knotted idiom of his late style. Readers have been choosing between the two Jameses ever since, though most do not know that they are choosing: a paperback of The Portrait of a Lady may reproduce the text of 1881 or that of 1908, and the difference is not one of commas. Someone must decide which text a reader meets first, and that someone is usually an editor working under a doctrine most readers have never heard of.", "For much of the twentieth century the doctrine was the pursuit of the author's final intention. Its most influential source, W. W. Greg's essay 'The Rationale of Copy-Text' of 1950, was in fact more modest than the uses later made of it. Greg distinguished a text's 'substantive' readings, its words, from its 'accidentals', its spelling and punctuation, and advised editors to take the accidentals from the earliest authoritative version, since printers' house styles altered them with each resetting, while admitting the author's later revisions of substance. In the hands of Greg's successors the method hardened into a principle: an edition should present the text its author finally intended, cleared of everything others had done to it. Applied to James, the principle seems to give a clear verdict. The collected edition is what he finally intended, and the editor's task is to print it.", "The difficulty is that 'final' here does two jobs. It can mean last in time, or it can mean consummating: the intention toward which earlier versions were striving and in which they come to rest. The doctrine needs the second sense but can verify only the first. The late James revising the early novels was not, on most critics' accounts, completing what the young James had begun; he was reading the young James and rewriting him, as a gifted but partial reader would. To call the result the work's fulfilment is to assume that a writer's last word on a book must be his best word on it, a claim about literary value smuggled into a rule about documents.", "A rival school, associated above all with Jerome McGann's critique of 1983, argued that the editorial fixation on authorial intention misdescribes how texts come into being. Texts, on this view, are social products, made by publishers, editors, compositors and censors as well as by authors, and an edition should record the versions that actually circulated rather than reconstruct one that existed only in the author's mind. The argument corrects a real naivety, but it pays for the correction by dissolving a distinction readers have every reason to keep. If every change is simply an event in the text's social history, then James's rewriting of a sentence and a compositor's misreading of his hand have the same standing, and whether James wrote a given word, often the question a reader most wants answered, ceases to be the editor's concern.", "Digital editions now promise to end the quarrel: show the reader every version, with the variants aligned, and let her choose. The promise is genuine, and so is what it hides. A reader offered every text with no guidance on which to read first has not been freed from the editor's judgment so much as handed it, usually without the knowledge needed to exercise it. And some works resist the choice for a reason the debate seldom names. The revisions of a book its author could not leave alone may record less an intention, final or otherwise, than the fact that for its author the book was never finished, in which case no single text, and no display of all of them, can simply be the work."], "qs": [{"stem": "Which of the following best captures the central concern of the passage?", "o": ["James's late revisions read his early novels rather than completing them, and whether editors should print the first texts may never be settled.", "Each main way of choosing a revised work's text carries a cost its advocates overlook, and some works may not admit of one authoritative text at all.", "The social theory of texts corrects the naivety of the final-intention doctrine and should replace it, though digital editions may yet make the choice unnecessary.", "Attempts to fix the text of a literary work tend to rest on hidden judgments of literary value that editors are usually unwilling to admit openly."]}, {"stem": "Which of the following, if true, would most strengthen the author's objection to the social theory of texts in the fourth paragraph?", "o": ["Printers in James's day routinely imposed their own house style on the spelling and punctuation of the novels they set, whatever the author preferred.", "McGann's critique was widely adopted by editors of nineteenth-century fiction in the decades that followed, as older methods fell away.", "Most readers who meet The Portrait of a Lady today first read it in the revised text of 1908, not in the text as first published in 1881.", "Critics' readings of particular passages in James have repeatedly changed once a puzzling word was traced to a compositor, not to James."]}, {"stem": "The author's charge in the third paragraph, that the final-intention principle smuggles 'a claim about literary value' into 'a rule about documents', assumes that", "o": ["a rule for choosing between texts ought not to rest on a judgment of literary merit that it never states.", "the 1881 text of The Portrait of a Lady is a better novel than the text that James produced for the collected edition.", "W. W. Greg would not himself have accepted the principle into which his successors later hardened his own method.", "Greg's distinction between substantive readings and accidentals cannot be applied to revisions as extensive as James's."]}, {"stem": "Choose the option that best replaces the words in brackets to make the sentence grammatically correct without changing its meaning.", "quote": "\"James rewrote several of his early novels for the collected edition [, it left] readers with two texts to choose between.\"", "o": [", thereby it left", "so as to leave", ", thereby leaving", "; thereby leaving"]}, {"stem": "Which of the following best describes the tone of the passage?", "o": ["Detached and analytical, because it sets out the rival editorial doctrines in turn, explaining how each arose and what it claims.", "Sceptical and wistful, because it ends by suggesting that for some works no single text, and no display of all of them, can be the work.", "Impatient and dismissive, because it finds fault in turn with the final-intention principle, the social theory and the digital promise.", "Exacting and even-handed, because it separates Greg from his successors and grants the social theory and digital editions their real merits."]}, {"stem": "Which of the following can be most reasonably inferred from the last paragraph of the passage?", "o": ["Works that their authors revised more than once were probably, for those authors, never truly finished, however settled their printed text.", "A digital edition that told its readers which version to read first would, to that extent, be keeping the editor's judgment in place rather than abolishing it.", "Digital editions are less honest than printed ones, since they hide the editor's own choices behind an apparently neutral display of every version.", "A book its author could not leave alone records his final intention more faithfully than any single version of it, however carefully edited, can."]}]}]};

const P=DATA.passages, CODES=DATA.codes, QS=[];
P.forEach((p,pi)=>p.qs.forEach(q=>{ q.n=QS.length+1; q.pi=pi; QS.push(q); }));
const LIMIT=45*60*1000, L="abcd", TOTAL=QS.length, LSKEY="rc800s4-current";
let REV=null;
function unseal(){ if(REV) return REV; const b=atob(SEAL), k="rc800-sectional-4", out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i)^((k.charCodeAt(i%k.length)+i*7)%256);
  REV=JSON.parse(new TextDecoder().decode(out)); return REV; }

/* ------------------------------------------------------------------ STATE */
let S=null, db=null, view="start", past=[], saveTimer=null, tickTimer=null, lastTick=0, saveMsg="";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function newAttempt(){ return {id:"att-"+Date.now().toString(36), startedAt:Date.now(), status:"in_progress", answers:{}, flags:{}, passageMs:{}, changes:{}, firstAt:{}, cur:0}; }
function elapsed(st=S){ return st ? Math.min(LIMIT,(st.submittedAt||Date.now())-st.startedAt) : 0; }

function score(st){
  const R=unseal(); let r=0,w=0,u=0; const traps={}, per=[];
  QS.forEach(q=>{ const a=st.answers[q.n], k=R.key[q.n-1]; let t=null;
    if(!a) u++; else if(a===k) r++; else { w++; t=R.traps[q.n-1][a]; if(t) traps[t]=(traps[t]||0)+1; }
    per.push({n:q.n,picked:a||null,correct:k,trap:t}); });
  return {r,w,u,net:r-0.25*w,traps,per};
}

/* ------------------------------------------------------------------ PERSISTENCE */
function persistSoon(){ ls.set(LSKEY,S); clearTimeout(saveTimer); saveTimer=setTimeout(persistNow,1500); }
async function persistNow(){
  if(S&&S.status==="in_progress") ls.set(LSKEY,S);
  if(!db||!S) return;
  try{
    const body=JSON.parse(JSON.stringify(S));
    if(S.status==="submitted"){ const sc=score(S); body.result={right:sc.r,wrong:sc.w,unanswered:sc.u,net:sc.net,traps:sc.traps,perQuestion:sc.per,timeMs:elapsed()}; }
    await db.collection("attempts").doc(S.id).set(body);
    saveMsg="Saved"; paintSaved();
  }catch(e){ saveMsg= e&&e.code==="quota_exceeded" ? "Storage full: kept in this browser only" : "Saved in this browser"; paintSaved(); }
}
function paintSaved(){ const el=document.getElementById("saved"); if(el) el.textContent=saveMsg; }
async function loadPast(){
  if(!db) return;
  try{ const snap=await db.collection("attempts").orderBy("startedAt","desc").limit(20).get();
    past=snap.docs.map(d=>d.data()).filter(Boolean); if(view==="start") render(); }catch(e){}
}

/* ------------------------------------------------------------------ RENDER */
function render(){ if(view==="start") return renderStart(); if(view==="test") return renderTest(); if(view==="result") return renderResult(); }

function renderStart(){
  const local=ls.get(LSKEY);
  const resume=(local&&local.status==="in_progress")?local:(past.find(a=>a.status==="in_progress")||null);
  const done=past.filter(a=>a.status==="submitted"&&a.result);
  const left=resume?LIMIT-(Date.now()-resume.startedAt):0;
  app.innerHTML=`<div class="gut"><div class="wrap"><div class="intro">
    <div class="stack">
      <p class="eyebrow">Sectional 4 · Reading comprehension · harder than Sectional 1</p>
      <h1>RC 800 Sectional 4</h1>
      <p style="font:17px/1.6 var(--f-read);max-width:62ch">Four passages, 24 questions, Countdown CLAT formats at GMAT 800 and CAT difficulty. Every passage carries at least one strengthen or weaken question and at least one assumption or conclusion question: nine critical-reasoning items in all. The wrong options are built on the traps in your error log, and the four options in each question are matched for length, so length tells you nothing.</p>
      <div class="facts">
        <div class="fact"><b>24</b><span>questions · 4 passages × 6</span></div>
        <div class="fact"><b>45:00</b><span>hard limit; submits itself at zero</span></div>
        <div class="fact"><b>+1 / −0.25</b><span>blank scores 0</span></div>
      </div>
      <div class="plist">${P.map((p,i)=>`<b>P${i+1}</b><span>${esc(p.kind)}</span>`).join("")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${resume&&left>0?`<button class="btn primary" id="resume">Resume (${fmt(left)} left)</button><button class="btn" id="fresh">Start a fresh attempt</button>`:`<button class="btn primary" id="start">Start the clock</button>`}
      </div>
    </div>
    <div class="sheet">
      <h3>Before you start</h3>
      <ol class="rules">
        <li>The clock runs for 45 minutes and submits your answers when it reaches zero. A reload does not stop it.</li>
        <li>Answers and flags save as you go, so a reload or a dropped connection won't lose them.</li>
        <li>Submit asks you to confirm. Answers, explanations and trap codes appear only after that.</li>
        <li>Each wrong answer is tagged with the trap it fell for, using the codes from your error log.</li>
      </ol>
      ${done.length?`<div class="past"><p class="eyebrow">Previous attempts</p>${done.slice(0,5).map(a=>`<div><span>${new Date(a.startedAt).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span><span>${Number(a.result.net).toFixed(2)} / ${TOTAL} · ${a.result.right} right · ${a.result.wrong} wrong · ${fmt(a.result.timeMs)}</span></div>`).join("")}</div>`:""}
    </div>
  </div></div></div>`;
  const go=st=>{ S=st; view="test"; render(); persistNow(); startTick(); window.scrollTo({top:0}); };
  document.getElementById("start")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("fresh")?.addEventListener("click",()=>{ ls.del(LSKEY); go(newAttempt()); });
  document.getElementById("resume")?.addEventListener("click",()=>go(resume));
}

const answeredIn=pi=>P[pi].qs.filter(q=>S.answers[q.n]).length;
const flaggedIn=pi=>P[pi].qs.filter(q=>S.flags[q.n]).length;

function renderTest(){
  const p=P[S.cur], answered=Object.keys(S.answers).length;
  app.innerHTML=`<div class="bar"><div class="bar-in gut">
      <span class="clock" id="clock" role="timer" aria-label="Time left">45:00</span>
      <span class="count" id="count">${answered}/${TOTAL} answered</span>
      <nav class="tabs" aria-label="Passages">${P.map((x,i)=>`<button class="tab" data-p="${i}" aria-current="${i===S.cur}">P${i+1}<span class="n">${answeredIn(i)}/${x.qs.length}</span>${flaggedIn(i)?`<span class="fl" title="flagged">⚑${flaggedIn(i)}</span>`:""}</button>`).join("")}</nav>
      <span class="spacer"></span><span class="saved" id="saved">${esc(saveMsg)}</span>
      <button class="btn danger" id="submit">Submit</button>
    </div></div>
    <div class="gut"><div class="wrap" style="padding-top:0">
      <div id="confirmBox"></div>
      <div class="test">
        <article class="passage" aria-label="${esc(p.label)}">
          <div class="head"><p class="eyebrow">${esc(p.kind)}</p><h2>${esc(p.label)}</h2></div>
          <div class="body">${p.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
        </article>
        <section class="qs" aria-label="Questions">${p.qs.map(qCard).join("")}
          <div class="navrow">${S.cur>0?`<button class="btn" id="prev">← Passage ${S.cur}</button>`:"<span></span>"}${S.cur<P.length-1?`<button class="btn primary" id="next">Passage ${S.cur+2} →</button>`:`<button class="btn danger" id="submit2">Submit</button>`}</div>
        </section>
      </div>
    </div></div>`;
  app.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchP(+b.dataset.p)));
  document.getElementById("prev")?.addEventListener("click",()=>switchP(S.cur-1));
  document.getElementById("next")?.addEventListener("click",()=>switchP(S.cur+1));
  ["submit","submit2"].forEach(id=>document.getElementById(id)?.addEventListener("click",askSubmit));
  app.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>pick(+r.dataset.q,r.value)));
  app.querySelectorAll(".flag").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; S.flags[n]=!S.flags[n]; persistSoon(); renderTest(); }));
  app.querySelectorAll(".clear").forEach(b=>b.addEventListener("click",()=>{ const n=+b.dataset.q; delete S.answers[n]; persistSoon(); renderTest(); }));
  tickClock();
}

function stemHTML(q){
  return (q.quote?`<p class="stem">${esc(q.stem)}</p><div class="quote">${esc(q.quote)}</div>${q.after?`<p class="stem">${esc(q.after)}</p>`:""}`:`<p class="stem">${esc(q.stem)}</p>`);
}
function qCard(q){
  const a=S.answers[q.n];
  return `<div class="q" id="q${q.n}">
    <div class="top"><span class="qn">Q${q.n}</span><button class="flag" data-q="${q.n}" aria-pressed="${!!S.flags[q.n]}">${S.flags[q.n]?"⚑ Flagged":"⚐ Flag"}</button></div>
    ${stemHTML(q)}
    <div class="opts" role="radiogroup" aria-label="Question ${q.n}">${q.o.map((t,i)=>{const l=L[i];return `<label class="opt${a===l?" sel":""}"><input type="radio" id="q${q.n}${l}" name="q${q.n}" value="${l}" data-q="${q.n}"${a===l?" checked":""}><span class="L">${l}</span><span>${esc(t)}</span></label>`}).join("")}</div>
    ${a?`<button class="clear" data-q="${q.n}">Clear answer</button>`:""}
  </div>`;
}
function pick(n,l){
  if(!S||S.status!=="in_progress") return;
  if(S.answers[n]&&S.answers[n]!==l) S.changes[n]=(S.changes[n]||0)+1;
  if(!S.firstAt[n]) S.firstAt[n]=Date.now()-S.startedAt;
  S.answers[n]=l;
  const card=document.getElementById("q"+n);
  if(card){ card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").value===l));
    if(!card.querySelector(".clear")){ const b=document.createElement("button"); b.className="clear"; b.dataset.q=n; b.textContent="Clear answer"; b.addEventListener("click",()=>{ delete S.answers[n]; persistSoon(); renderTest(); }); card.appendChild(b);} }
  const cnt=document.getElementById("count"); if(cnt) cnt.textContent=Object.keys(S.answers).length+"/"+TOTAL+" answered";
  app.querySelectorAll(".tab").forEach((b,i)=>{ const s=b.querySelector(".n"); if(s) s.textContent=answeredIn(i)+"/"+P[i].qs.length; });
  persistSoon();
}
function switchP(i){ accrue(); S.cur=i; persistSoon(); renderTest(); window.scrollTo({top:0}); }
function accrue(){ const now=Date.now(); if(lastTick&&view==="test"&&S&&!document.hidden){ const k=P[S.cur].id; S.passageMs[k]=(S.passageMs[k]||0)+(now-lastTick);} lastTick=now; }
function startTick(){ clearInterval(tickTimer); lastTick=Date.now(); tickTimer=setInterval(()=>{ accrue(); tickClock(); },1000); }
function tickClock(){
  if(!S||view!=="test") return;
  const left=LIMIT-(Date.now()-S.startedAt);
  if(left<=0){ submit(true); return; }
  const el=document.getElementById("clock"); if(!el) return;
  el.textContent=fmt(left); el.classList.toggle("low",left<5*60*1000);
}
function askSubmit(){
  const un=TOTAL-Object.keys(S.answers).length, fl=Object.values(S.flags).filter(Boolean).length;
  const box=document.getElementById("confirmBox");
  box.innerHTML=`<div class="confirm" role="alertdialog" aria-label="Confirm submission"><p><b>Submit now?</b> ${un} unanswered${fl?`, ${fl} flagged`:""}. You can't change answers after this.</p><span class="spacer"></span><button class="btn" id="keep">Keep working</button><button class="btn danger" id="really">Submit and see results</button></div>`;
  box.scrollIntoView({block:"nearest"});
  document.getElementById("keep").addEventListener("click",()=>box.innerHTML="");
  document.getElementById("really").addEventListener("click",()=>submit(false));
}
function submit(auto){
  if(!S||S.status!=="in_progress") return;
  accrue(); clearInterval(tickTimer);
  S.status="submitted"; S.auto=!!auto; S.submittedAt=auto?Math.min(Date.now(),S.startedAt+LIMIT):Date.now();
  ls.del(LSKEY); view="result"; persistNow(); render(); window.scrollTo({top:0}); loadPast();
}

function renderResult(){
  const R=unseal(), sc=score(S), t=elapsed();
  const trapRows=Object.entries(sc.traps).sort((a,b)=>b[1]-a[1]); const maxT=Math.max(1,...trapRows.map(x=>x[1]));
  const pRows=P.map(p=>{ const qs=p.qs; const r=qs.filter(q=>S.answers[q.n]===R.key[q.n-1]).length, w=qs.filter(q=>S.answers[q.n]&&S.answers[q.n]!==R.key[q.n-1]).length;
    return `<tr><td>${esc(p.label)} · ${esc(p.kind)}</td><td class="n">${r}</td><td class="n">${w}</td><td class="n">${qs.length-r-w}</td><td class="n">${fmt(S.passageMs[p.id]||0)}</td></tr>`; }).join("");
  app.innerHTML=`<div class="gut"><div class="wrap stack">
    <div class="stack" style="gap:8px"><p class="eyebrow">Result · ${new Date(S.startedAt).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p>
      <h1>${sc.net.toFixed(2)} out of ${TOTAL}</h1>
      <p class="muted">Time taken ${fmt(t)} of 45:00${S.auto?" · submitted automatically when time ran out":""}</p></div>
    <div class="scorehead">
      <div class="stat"><b>${sc.r}</b><span>right (+${sc.r})</span></div>
      <div class="stat"><b>${sc.w}</b><span>wrong (−${(0.25*sc.w).toFixed(2)})</span></div>
      <div class="stat"><b>${sc.u}</b><span>blank (0)</span></div>
      <div class="stat"><b>${sc.r+sc.w?Math.round(100*sc.r/(sc.r+sc.w)):0}%</b><span>accuracy on attempted</span></div>
    </div>
    <div class="intro" style="padding-top:0">
      <div class="sheet"><h3>Traps you fell for</h3>
        ${trapRows.length?`<div class="traps">${trapRows.map(([c,n])=>`<div class="trap"><span class="code">${c}</span><div><div style="font-weight:500">${esc(CODES[c][0])}</div><div class="muted" style="font-size:13px">${esc(CODES[c][1])}</div><div class="tbar" style="width:${Math.max(8,100*n/maxT)}%;margin-top:4px"></div></div><b style="font-family:var(--f-mono)">${n}</b></div>`).join("")}</div>`:`<p>No traps sprung. Every answer you gave was right.</p>`}
        <p class="muted" style="font-size:13px">Send me your time and the questions you got wrong or skipped, with what you marked, and I'll aim Sectional 5 at the pattern.</p>
      </div>
      <div class="ptable"><table><thead><tr><th>Passage</th><th style="text-align:right">Right</th><th style="text-align:right">Wrong</th><th style="text-align:right">Blank</th><th style="text-align:right">Time</th></tr></thead><tbody>${pRows}</tbody></table></div>
    </div>
    <div class="stack" style="gap:10px"><h2>Every question, marked</h2>
      <div class="review">${P.map(p=>`<details class="pz"><summary>${esc(p.label)}: re-read the passage</summary><div style="font:15px/1.65 var(--f-read);display:flex;flex-direction:column;gap:8px;padding:8px 2px">${p.text.map(x=>`<p>${esc(x)}</p>`).join("")}</div></details>`+p.qs.map(q=>rCard(q,R)).join("")).join("")}</div>
    </div>
    <div><button class="btn" id="home">Back to start</button></div>
  </div></div>`;
  document.getElementById("home").addEventListener("click",()=>{ view="start"; S=null; render(); loadPast(); });
}
function rCard(q,R){
  const i=q.n-1, a=S.answers[q.n], k=R.key[i], st=!a?"u":a===k?"r":"w", tr=R.traps[i], code=st==="w"?tr[a]:null;
  return `<div class="rq ${st}">
    <div class="rtop"><span class="qn">Q${q.n} · ${esc(P[q.pi].label)} · ${esc(R.type[i])}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${st==="r"?`<span class="pill r">Right</span>`:st==="u"?`<span class="pill u">Blank · answer ${k}</span>`:`<span class="pill w">You: ${a} · answer ${k} · Trap ${code}: ${esc(CODES[code][0])}</span>`}${S.changes[q.n]?`<span class="pill">changed ${S.changes[q.n]}×</span>`:""}</span></div>
    ${stemHTML(q)}
    <div class="opts">${q.o.map((t,j)=>{const l=L[j];const cls=l===k?"ans":(l===a?"bad":"");const tag=l===k?`<span class="pill r">key</span>`:`<span class="pill">${tr[l]}</span>`;return `<div class="ro ${cls}"><b>${l}</b><span>${esc(t)}</span>${tag}</div>`}).join("")}</div>
    <div class="why"><p>${esc(R.why[i])}</p>
      <details class="ex"${st==="w"?" open":""}><summary>Why each option is right or wrong</summary><ul>${L.split("").map(l=>`<li><b>${l}${l===k?" (key)":" · "+tr[l]}</b>: ${esc(R.reasons[i][l])}</li>`).join("")}</ul></details>
      <p class="muted" style="font-size:13px">Modelled on: ${esc(R.src[i])}</p></div>
  </div>`;
}

/* ------------------------------------------------------------------ BOOT */
document.addEventListener("visibilitychange",()=>{ if(view==="test"){ accrue(); if(document.hidden) persistNow(); }});
function start(data){
  if(data&&data.S){ S=data.S; view=data.view||"start"; }
  else { const local=ls.get(LSKEY);
    if(local&&local.status==="in_progress"&&Date.now()-local.startedAt>=LIMIT){ S=local; view="test"; submit(true); } }
  render();
  if(view==="test") startTick();
  (async()=>{ try{ db=window.claude?await window.claude.use("db"):null; }catch(e){ db=null; }
    if(db){ await loadPast();
      if(view==="start"){ const open=past.find(a=>a.status==="in_progress"&&!ls.get(LSKEY));
        if(open&&Date.now()-open.startedAt>=LIMIT){ S=open; view="test"; submit(true); } }
      else if(S) persistNow(); } })();
}
window.claude?.hot?.snapshot?.(()=>({S,view}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
