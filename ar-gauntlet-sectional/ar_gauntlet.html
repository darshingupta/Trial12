<style>
/* Layout: exam booklet. Passage sheet on the left, OMR-style answer column on the right; stacks on phones. */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#18212c; --muted:#5a6573; --rule:#d6dbe2;
  --accent:#2c5a86; --accent-soft:#e3ecf5; --flag:#a8670f; --flag-soft:#f8ecd9;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b3362c; --bad-soft:#f8e3e1;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151b; --sheet:#181e26; --ink:#e4e8ee; --muted:#9aa4b2; --rule:#2c3440;
  --accent:#7fb0dd; --accent-soft:#1f2f40; --flag:#e0a24a; --flag-soft:#3a2c17;
  --good:#5cc08d; --good-soft:#17332a; --bad:#ef7b70; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151b; --sheet:#181e26; --ink:#e4e8ee; --muted:#9aa4b2; --rule:#2c3440;
  --accent:#7fb0dd; --accent-soft:#1f2f40; --flag:#e0a24a; --flag-soft:#3a2c17;
  --good:#5cc08d; --good-soft:#17332a; --bad:#ef7b70; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:7px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px}
.tab{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:6px 12px;display:flex;gap:8px;align-items:baseline}
.tab .n{font-family:var(--serif);font-weight:600}
.tab .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;margin-top:12px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px 22px;min-width:0}
.passage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.passage{position:static;max-height:none}}
.kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.passage h2{font-family:var(--serif);font-size:22px;margin:4px 0 12px;text-wrap:balance}
.passage p{font-family:var(--serif);font-size:16px;line-height:1.65;margin:0 0 14px;max-width:68ch}
.passage ol{font-family:var(--serif);font-size:16px;line-height:1.6;margin:0;padding-left:1.8em;display:grid;gap:6px;max-width:68ch}
.passage ol li::marker{font-family:var(--mono);font-size:13px;color:var(--muted)}
.qs{display:grid;gap:16px;min-width:0}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:0}
.q.flagged{border-color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{font-family:var(--mono);font-weight:600;color:var(--accent);flex:0 0 auto;padding-top:1px}
.stem{flex:1;white-space:pre-line;min-width:0}
.flagbtn{flex:0 0 auto;border:1px solid var(--rule);background:transparent;border-radius:5px;font-size:12px;padding:2px 8px;color:var(--muted)}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.opts{display:grid;gap:6px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--rule);background:transparent;border-radius:6px;padding:8px 10px;width:100%}
.opt:hover{border-color:var(--accent)}
.bub{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.clear{margin-top:8px;font-size:12px;color:var(--muted);background:none;border:none;padding:0;text-decoration:underline}
.expl{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px;font-size:14px;display:grid;gap:6px}
.expl b{font-weight:600}
.conv{font-size:13px;color:var(--muted);margin:10px 0 0;display:grid;gap:2px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px;max-width:420px;width:100%;display:grid;gap:12px}
.score{display:flex;flex-wrap:wrap;gap:24px;align-items:baseline;margin-top:12px}
.score .big{font-family:var(--serif);font-size:40px;font-weight:600}
.score .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.sk{color:var(--muted)}
.solution{margin-top:10px;font-family:var(--serif);font-size:15px;background:var(--accent-soft);border-radius:6px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>AR Gauntlet Sectional</b><span>30 questions · 6 sets · no time limit</span></div>
    <div class="spacer"></div>
    <div class="clock" id="clock" title="Time spent">00:00:00</div>

  </div>
  <section id="results" hidden></section>
</div>
<div class="modal" id="confirm" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <b id="cTitle" style="font-family:var(--serif);font-size:18px">Submit the sectional?</b>
    <div id="cBody" style="color:var(--muted)"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="cNo" type="button">Keep working</button>
      <button class="btn primary" id="cYes" type="button">Submit and see results</button>
    </div>
  </div>
</div>

<script>
const DATA = {"ver": "r4275", "conventions": ["Left and right are always judged from the person's own position, in the direction he or she faces.", "'X sits second to the right of Y' means X is the second person counted from Y towards Y's right; one person sits between them.", "In a circle, 'n persons sit between X and Y' is true when exactly n persons sit between them along at least one of the two arcs.", "Every condition in a passage is true. A question that adds or removes a condition does so for that question only."], "passages": [{"title": "Passage I: The Round Table", "kind": "Circular arrangement, mixed facing", "intro": "Eight lawyers, Anvi, Bharat, Charu, Dev, Esha, Faiz, Gia and Hari, sit around a circular table at equal distances. Some of them face the centre of the table and the rest face away from it. Two of them are Judges, two are Advocates, two are Professors and two are Clerks.", "conds": ["Charu sits third to the left of Gia.", "As many of the eight face the centre as face away from it.", "Faiz sits immediately to the right of Esha, and Esha sits immediately to the right of Faiz.", "Exactly one person sits between Dev and Bharat, and that person faces the same direction as Anvi.", "Dev faces away from the centre.", "Neither of Faiz's immediate neighbours faces the same direction as Faiz.", "Bharat faces the same direction as exactly one of Bharat's two immediate neighbours.", "Hari sits second to the left of Gia.", "The two Judges sit directly opposite each other.", "One of Faiz's immediate neighbours is a Clerk who faces the centre; the other is a Professor.", "The person sitting second to the left of Hari is an Advocate.", "Bharat and Esha have the same profession.", "Dev is not a Professor.", "No Advocate sits next to a Judge."], "qs": [{"stem": "Three of the following four pairs are alike: in each, the second person occupies the same position relative to the first person, judged from the first person's own left and right. Which pair is the odd one out?", "opts": ["Bharat – Faiz", "Esha – Gia", "Anvi – Charu", "Dev – Hari"]}, {"stem": "For how many of the eight lawyers does the person sitting third to his or her left face the same direction as he or she does?", "opts": ["Two", "Four", "Six", "Eight"]}, {"stem": "Which of the following is/are true?\nI. Exactly three persons sit between the two Professors, whichever way one counts.\nII. Each Clerk sits immediately to the right of an Advocate.\nIII. Each Judge has a Clerk as an immediate neighbour.", "opts": ["Only I and III", "Only I", "Only II and III", "Only III"]}, {"stem": "Which one of the following conditions could be dropped without changing the seat of any person or the direction any person faces?", "opts": ["Condition 2", "Condition 7", "Condition 10", "Condition 11"]}, {"stem": "Suppose Charu and Esha exchange seats, each keeping the direction he or she faces, and nothing else changes. Which of the conditions would then be violated?", "opts": ["Condition 3 only", "Conditions 1 and 3 only", "Conditions 1, 3 and 10 only", "Conditions 3, 6 and 10 only"]}]}, {"title": "Passage II: The Two Rings", "kind": "Concentric circular arrangement", "intro": "Twelve participants of a mediation workshop, Kabir, Leela, Mohan, Naina, Omkar, Pari, Qadir, Rhea, Sahil, Tara, Uday and Vani, sit in two concentric circles of six seats each. Everyone in the inner circle faces outward and everyone in the outer circle faces the centre. The seats are aligned so that each person in the inner circle sits directly facing exactly one person in the outer circle. 'Left', 'right', 'next to', 'between' and 'opposite' refer only to people in the same circle.", "conds": ["Rhea sits immediately to the right of Kabir.", "Omkar faces the person who sits immediately to the left of Mohan.", "Vani and Naina sit in the same circle, with only one person between them.", "Leela sits in the outer circle, second to the left of Pari.", "Tara faces the person who sits immediately to the left of Rhea.", "Qadir faces the person who sits second to the right of Omkar.", "Vani faces the person who sits directly opposite Tara.", "Uday does not sit next to Kabir, and Sahil does not face Pari."], "qs": [{"stem": "Three of the following four groups are alike in the way their three members are placed relative to one another, judged from each person's own left and right. Which group is the odd one out?", "opts": ["Kabir, Tara, Qadir", "Pari, Vani, Naina", "Rhea, Mohan, Leela", "Mohan, Rhea, Naina"]}, {"stem": "Suppose Condition 1 is changed to 'Rhea sits immediately to the left of Kabir', and every other condition stays. Who would then face Kabir?", "opts": ["Tara", "Qadir", "Leela", "Pari"]}, {"stem": "For how many of the twelve participants can the person sitting immediately to his or her right be named with certainty?", "opts": ["Six", "Eight", "Ten", "Twelve"]}, {"stem": "Which of the following must be true?", "opts": ["The person who faces Qadir sits immediately to the right of Vani.", "Uday faces Omkar.", "Sahil sits second to the left of Kabir.", "Exactly one person sits between Tara and Uday."]}, {"stem": "Which one of the following, if true, would establish that Sahil faces Qadir?", "opts": ["Uday sits immediately to the right of Vani.", "Sahil and Uday face in different directions.", "The person who faces Uday sits immediately to the left of Vani.", "Neither Sahil nor Uday sits next to Tara."]}]}, {"title": "Passage III: The Five-Storey Block", "kind": "Floor-and-flat (tabular) arrangement", "intro": "Eight friends, Ishaan, Juhi, Lalit, Meher, Nikhil, Ojas, Prisha and Ruhi, live in a five-storey building whose floors are numbered 1 (lowest) to 5 (top). Each floor has two flats, West and East. Every West flat is directly above the West flat of the floor below, and every East flat directly above the East flat. Each friend lives in a different flat, so exactly two flats are vacant. Each friend plays a different one of eight sports: Archery, Chess, Hockey, Kabaddi, Polo, Rugby, Squash and Tennis. 'Directly above' means in the same column, exactly one floor higher.", "conds": ["Juhi lives in a West flat, directly above Ojas, and nobody else lives on Juhi's floor.", "The two vacant flats are on different floors, and exactly one floor lies between those two floors.", "Lalit lives directly above the person who plays Polo.", "Exactly one floor lies between the Archery player's floor and Prisha's floor.", "The Squash player lives in a West flat on a floor that has no vacant flat.", "Ruhi lives in a West flat, directly above Nikhil.", "Meher lives on a lower floor than Ishaan.", "The Tennis player and the Kabaddi player live on the same floor.", "The Chess player lives in the same column as the Kabaddi player, at least two floors higher.", "The Hockey player lives in an East flat, directly below someone who plays neither Tennis nor Squash.", "The Rugby player lives on the floor immediately below the Tennis player's floor."], "qs": [{"stem": "Three of the following four pairs are alike in the way the first-named person's flat is placed relative to the second-named person's flat. Which pair is the odd one out?", "opts": ["Juhi – the Chess player", "The Chess player – Ruhi", "Prisha – the Tennis player", "The Squash player – Prisha"]}, {"stem": "Which of the following can be determined with certainty?\nI. The floor on which Lalit lives.\nII. The sport played by the person who lives directly below the Chess player.\nIII. The person who lives directly above the Kabaddi player.", "opts": ["Only I", "Only I and III", "Only II and III", "Only III"]}, {"stem": "If Lalit plays Kabaddi, which of the following must be false?", "opts": ["Prisha plays Hockey.", "Ishaan lives directly above Prisha.", "The Polo player lives on a floor that has a vacant flat.", "Meher lives directly below the Kabaddi player."]}, {"stem": "For how many of the eight friends can both the flat and the sport be determined with certainty?", "opts": ["Four", "Five", "Six", "Eight"]}, {"stem": "Which one of the following, if true, would establish that Meher plays Hockey?", "opts": ["Lalit and Ishaan both live on even-numbered floors.", "The Polo player lives directly below the Kabaddi player.", "The Hockey player lives on a lower floor than the Chess player.", "The Chess player lives directly above the Polo player."]}]}, {"title": "Passage IV: The Lecture Calendar", "kind": "Scheduling with unused dates", "intro": "Eight speakers, Sana, Tanay, Urvi, Vihaan, Waseem, Xenia, Yash and Zoya, each deliver exactly one seminar in a lecture series run within one calendar year that is not a leap year. A seminar can be held only on the 8th or the 23rd of February, April, May, July, September or November, and no two seminars are held on the same date, so four of these twelve dates go unused. Each seminar is either online or offline. When the conditions count seminars 'between' two others, or speak of seminars held 'one after the other', they count seminars actually held and ignore unused dates.", "conds": ["Only two seminars are held between Sana's seminar and Zoya's seminar.", "Tanay's seminar is held in the calendar month that immediately follows the month of Yash's seminar.", "No seminar is held after Waseem's.", "Xenia and Vihaan speak in the same month, Xenia first.", "Urvi's seminar is held in a month that has fewer than 30 days.", "No two seminars held one after the other are of the same kind (online or offline).", "The first seminar of the series is online.", "Tanay's seminar is held on the 23rd.", "The number of unused dates before Tanay's seminar equals the number of unused dates after Zoya's seminar.", "Urvi's seminar is the only seminar held in its month."], "qs": [{"stem": "Three of the following four pairs of speakers are alike in where the second-named speaker's seminar falls in the series relative to the first-named speaker's seminar. Which pair is the odd one out?", "opts": ["Zoya – the speaker whose seminar is held exactly 46 days away from Zoya's", "The first offline speaker – Zoya", "Yash – the speaker who speaks immediately after Zoya", "The offline speaker whose seminar falls in a 31-day month – Vihaan"]}, {"stem": "If the number of days from Urvi's seminar to Sana's seminar is greater than the number of days from Vihaan's seminar to Waseem's seminar, on which dates are Urvi's and Waseem's seminars held?", "opts": ["23 February and 8 November", "23 February and 23 November", "8 February and 23 November", "8 February and 8 November"]}, {"stem": "Which of the following must be true?", "opts": ["Exactly one unused date lies between Urvi's seminar and Sana's seminar.", "As many online seminars are held before Tanay's seminar as offline seminars are held after Zoya's seminar.", "Waseem's seminar is held exactly 46 days after Vihaan's seminar.", "The last unused date of the year comes after Waseem's seminar."]}, {"stem": "Suppose Condition 10 is dropped and all the other conditions stay. Which of the following would then be impossible?", "opts": ["Sana's seminar is held on 23 February.", "April has an unused date.", "Urvi's seminar is held on 23 February and Yash's on 8 April.", "Both Urvi's and Waseem's seminars are held on the 8th."]}, {"stem": "How many of the speakers could have their seminar held exactly 15 days after one of the twelve possible dates that goes unused?", "opts": ["One", "Two", "Three", "Four"]}]}, {"title": "Passage V: The Family Row", "kind": "Blood relations with linear seating, mixed facing", "intro": "Eight members of a three-generation family, B, D, F, G, J, K, S and V, sit in a single row of eight seats numbered 1 to 8 from west to east. Each faces either north or south. The family is made up of one married couple in the oldest generation, their two children, the spouse of each of those two children, and two grandchildren, who have the same two parents. Every married couple is one man and one woman. An aunt is a sister of a parent or the wife of a parent's brother. Nobody's gender is known except as it follows from the conditions.", "conds": ["K is the mother-in-law of exactly two members of the family.", "J is F's sister.", "S is an aunt of J.", "The two persons at the ends of the row face opposite directions.", "Exactly four members face north.", "A grandmother of J sits immediately to J's left.", "G sits second to the right of a son-in-law of G.", "Exactly three persons sit between D and D's spouse.", "F sits at one end of the row and faces the same direction as a grandfather of F.", "The person sitting immediately to the right of S is a grandchild of K.", "V sits third to the left of J.", "G's wife sits third to the right of G.", "The person in seat 1 belongs to the youngest generation.", "F faces the same direction as F's mother."], "qs": [{"stem": "Three of the following four pairs are alike: in each, the second person occupies the same position relative to the first person, judged from the first person's own left and right. Which pair is the odd one out?", "opts": ["S – B", "G – K", "B – S", "K – G"]}, {"stem": "How many members of the family are definitely female?", "opts": ["Three", "Four", "Five", "Cannot be determined"]}, {"stem": "How is the person sitting third to the right of D related to D?", "opts": ["D's sister's husband", "D's wife's brother", "Either D's brother or D's sister's husband; the conditions do not settle which", "Either D's sister's husband or D's wife's sister's husband; the conditions do not settle which"]}, {"stem": "Who sits second to the left of the husband of F's aunt?", "opts": ["J", "G", "K", "V"]}, {"stem": "Which of the following is/are definitely true?\nI. G sits second to the right of each of his sons-in-law.\nII. K's grandchildren face the same direction as each other.\nIII. Exactly one person sits between V and V's mother-in-law.", "opts": ["Only II", "Only I and II", "Only II and III", "I, II and III"]}]}, {"title": "Passage VI: The Warehouse Stack", "kind": "Vertical (stack) arrangement with weights", "intro": "Seven boxes, E, H, K, M, P, U and W, are stacked one above another in a single stack. Positions are numbered 1 (bottom) to 7 (top). The boxes weigh 9, 12, 16, 18, 25, 27 and 36 kg, one weight per box, not necessarily in that order.", "conds": ["No box is placed above the box that weighs 16 kg.", "The weight of K equals the combined weight of the box immediately above K and the box immediately below K.", "U weighs exactly twice as much as W.", "H is lighter than M but heavier than P.", "E weighs exactly as much as the two boxes immediately below E put together.", "Exactly two boxes lie between P and the box that weighs 27 kg.", "M is placed somewhere above U."], "qs": [{"stem": "Take the boxes of each group below in their order in the stack, from bottom to top, and look at whether the weight rises or falls from one box to the next. In three of the groups the weights change in the same way. Which group is the odd one out?", "opts": ["K, P, W", "H, K, M", "K, M, W", "H, K, P"]}, {"stem": "Suppose Condition 1 is dropped and all the other conditions stay. In how many of the possible stacks would the 16 kg box be placed somewhere below the 25 kg box?", "opts": ["One", "Two", "Three", "Four"]}, {"stem": "Suppose Condition 4 is replaced by: 'H is heavier than M, and M is heavier than P.' All the other conditions stay. Which of the following could NOT be true?", "opts": ["H weighs 16 kg.", "H is placed at the bottom of the stack.", "P is placed immediately below H.", "M is placed at the top of the stack."]}, {"stem": "Suppose Condition 7 is dropped and all the other conditions stay. Which of the following would then be true?", "opts": ["Exactly two boxes keep the same position in every possible stack.", "P can occupy exactly two different positions.", "There are exactly two possible stacks.", "All but one of the boxes can each occupy at least two different positions."]}, {"stem": "Which of the following is/are true?\nI. The three topmost boxes const LET = 'ABCD';
const STORE = 'ar-gauntlet-v1';
let st = {ans:{}, flag:{}, elapsed:0, running:true, done:false, cur:0};
try { const s = JSON.parse(localStorage.getItem(STORE)||'null'); if (s && s.ver===DATA.ver) st = Object.assign(st, s); } catch(e){}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(Object.assign({ver:DATA.ver}, st))); } catch(e){} };
const qIndex = []; DATA.passages.forEach((p,pi)=>p.qs.forEach((q,qi)=>qIndex.push([pi,qi])));
const gnum = (pi,qi) => DATA.passages.slice(0,pi).reduce((a,p)=>a+p.qs.length,0)+qi+1;
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function fmt(t){t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
let last = Date.now();
setInterval(()=>{const now=Date.now(); if(st.running && !st.done){st.elapsed += (now-last)/1000;} last=now;
  document.getElementById('clock').textContent=fmt(st.elapsed); if(Math.floor(st.elapsed)%5===0) save();},1000);
document.getElementById('pauseBtn').onclick=()=>{ if(st.done) return; st.running=!st.running;
  document.getElementById('pauseBtn').textContent=st.running?'Pause':'Resume'; save(); };

function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  DATA.passages.forEach((p,pi)=>{
    const n=p.qs.length, a=p.qs.filter((_,qi)=>st.ans[gnum(pi,qi)]!==undefined).length;
    const b=document.createElement('button'); b.type='button'; b.className='tab'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(pi===st.cur));
    b.innerHTML=`<span class="n">${['I','II','III','IV','V','VI'][pi]}</span><span class="c">${a}/${n}</span>`;
    b.onclick=()=>{st.cur=pi; save(); render();};
    t.appendChild(b);
  });
}
function render(){
  renderTabs();
  const p=DATA.passages[st.cur], pi=st.cur;
  const ps=document.getElementById('passage');
  ps.innerHTML=`<div class="kind">${esc(p.kind)}</div><h2>${esc(p.title)}</h2><p>${esc(p.intro)}</p><ol>${p.conds.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`+
    (pi===0?`<div class="conv"><b style="color:var(--ink)">Conventions for every set</b>${DATA.conventions.map(c=>`<span>· ${esc(c)}</span>`).join('')}</div>`:'')+
    (st.done?`<div class="solution"><b>Solution.</b> ${esc(KEY.sol[pi])}</div>`:'');
  const qs=document.getElementById('questions'); qs.innerHTML='';
  p.qs.forEach((q,qi)=>{
    const n=gnum(pi,qi), k=KEY.q[n-1];
    const d=document.createElement('article'); d.className='q'+(st.flag[n]?' flagged':'');
    let html=`<div class="qhead"><span class="qnum">Q${n}</span><div class="stem">${esc(q.stem)}</div>`+
      (st.done?'':`<button type="button" class="flagbtn" aria-pressed="${!!st.flag[n]}" data-flag="${n}">${st.flag[n]?'Flagged':'Flag'}</button>`)+`</div><div class="opts" role="radiogroup">`;
    q.opts.forEach((o,oi)=>{
      let cls='opt'; if(st.done){ if(oi===k.a) cls+=' right'; else if(st.ans[n]===oi) cls+=' wrong'; }
      html+=`<button type="button" class="${cls}" role="radio" aria-checked="${st.ans[n]===oi}" data-q="${n}" data-o="${oi}" ${st.done?'disabled':''}><span class="bub">${LET[oi]}</span><span>${esc(o)}</span></button>`;
    });
    html+='</div>';
    if(!st.done && st.ans[n]!==undefined) html+=`<button type="button" class="clear" data-clear="${n}">Clear answer</button>`;
    if(st.done){
      const you = st.ans[n]===undefined?'not attempted':LET[st.ans[n]];
      html+=`<div class="expl"><div><b>Your answer:</b> ${you} · <b>Correct:</b> ${LET[k.a]}</div><div><b>Why.</b> ${esc(k.why)}</div><div><b>The trap.</b> ${esc(k.trap)}</div></div>`;
    }
    d.innerHTML=html; qs.appendChild(d);
  });
  const nav=document.createElement('div'); nav.className='navrow';
  nav.innerHTML=`<button class="btn" type="button" id="prevP" ${pi===0?'disabled':''}>Previous set</button><button class="btn" type="button" id="nextP" ${pi===DATA.passages.length-1?'disabled':''}>Next set</button>`;
  qs.appendChild(nav);
  document.getElementById('prevP').onclick=()=>{st.cur--;save();render();scrollTo(0,0)};
  document.getElementById('nextP').onclick=()=>{st.cur++;save();render();scrollTo(0,0)};
  qs.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.ans[+b.dataset.q]=+b.dataset.o; save(); render();});
  qs.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{const n=+b.dataset.flag; st.flag[n]=!st.flag[n]; save(); render();});
  qs.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{delete st.ans[+b.dataset.clear]; save(); render();});
}
function results(){
  const r=document.getElementById('results'); r.hidden=false;
  let right=0,wrong=0,skip=0, rows='';
  const per=DATA.passages.map(()=>[0,0]);
  qIndex.forEach(([pi,qi],i)=>{const n=i+1,k=KEY.q[i],a=st.ans[n];
    let res; if(a===undefined){skip++;res='<span class="sk">Skipped</span>'} else if(a===k.a){right++;per[pi][0]++;res='<span class="ok">Right</span>'} else {wrong++;res='<span class="no">Wrong</span>'}
    per[pi][1]++;
    rows+=`<tr><td>Q${n}</td><td>${['I','II','III','IV','V','VI'][pi]}</td><td>${a===undefined?'–':LET[a]}</td><td>${LET[k.a]}</td><td>${res}</td></tr>`;});
  const score=right-0.25*wrong;
  r.innerHTML=`<div class="sheet" style="margin-top:16px"><div class="kind">Results</div>
   <div class="score"><div><div class="big">${score.toFixed(2)}</div><div class="lbl">Score out of 30 (+1 / −0.25)</div></div>
   <div><div class="big">${right}</div><div class="lbl">Right</div></div><div><div class="big">${wrong}</div><div class="lbl">Wrong</div></div>
   <div><div class="big">${skip}</div><div class="lbl">Skipped</div></div><div><div class="big" style="font-family:var(--mono);font-size:30px">${fmt(st.elapsed)}</div><div class="lbl">Time taken</div></div></div>
   <div class="tbl"><table><thead><tr><th>Set</th>${DATA.passages.map((_,i)=>`<th>${['I','II','III','IV','V','VI'][i]}</th>`).join('')}</tr></thead>
   <tbody><tr><td>Right</td>${per.map(x=>`<td>${x[0]}/${x[1]}</td>`).join('')}</tr></tbody></table></div>
   <div class="tbl"><table><thead><tr><th>Q</th><th>Set</th><th>You</th><th>Key</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p style="color:var(--muted);font-size:13px;margin-top:12px">Open any set above to read the solution, the reasoning for each answer and the trap in each question.</p>
   <button class="btn" type="button" id="resetBtn">Start a fresh attempt</button></div>`;
  document.getElementById('resetBtn').onclick=()=>{st={ans:{},flag:{},elapsed:0,running:true,done:false,cur:0};save();r.hidden=true;render();scrollTo(0,0)};
}
const modal=document.getElementById('confirm');
document.getElementById('submitBtn').onclick=()=>{ if(st.done){results(); document.getElementById('results').scrollIntoView(); return;}
  const a=Object.keys(st.ans).length, f=Object.values(st.flag).filter(Boolean).length;
  document.getElementById('cBody').textContent=`You have answered ${a} of 30 questions${f?` and flagged ${f}`:''}. After submitting you will see the key, so this attempt cannot be changed.`;
  modal.hidden=false; document.getElementById('cYes').focus(); };
document.getElementById('cNo').onclick=()=>{modal.hidden=true};
document.getElementById('cYes').onclick=()=>{modal.hidden=true; st.done=true; st.running=false; save(); render(); results();
  document.getElementById('submitBtn').textContent='Results'; document.getElementById('results').scrollIntoView();};
document.getElementById('pauseBtn').textContent=st.running?'Pause':'Resume';
if(st.done){document.getElementById('submitBtn').textContent='Results'; render(); results();} else render();
</script>
